<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D5BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<title>Caderno de Treino</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%222%22 y=%2212%22 width=%226%22 height=%228%22 rx=%222%22 fill=%22%23FF6A2B%22/%3E%3Crect x=%2224%22 y=%2212%22 width=%226%22 height=%228%22 rx=%222%22 fill=%22%23FF6A2B%22/%3E%3Crect x=%226%22 y=%2214.5%22 width=%2220%22 height=%223%22 rx=%221.5%22 fill=%22%232D5BFF%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --sunk:#E9EDF6; --ink:#141B34; --muted:#5E6784; --line:#DCE1EE;
  --blue:#2D5BFF; --blue-deep:#1A3FD6; --blue-soft:#E2E9FF;
  --tang:#FF6A2B; --tang-soft:#FFE7DC;
  --violet:#7B5CF5; --violet-soft:#ECE6FF;
  --amber:#F2A007; --amber-soft:#FFF1D2;
  --mint:#12B07F; --mint-soft:#D8F4E9;
  --sky:#119FE3; --sky-soft:#DDF2FC; --pink:#E9468A; --teal:#0E9E9B;
  --danger:#E0363B; --danger-soft:#FDE3E3;
  --f-ui:"Schibsted Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px; --shadow:0 1px 2px rgba(20,27,52,.05),0 10px 30px -18px rgba(20,27,52,.22);
}
:root[data-tema="escuro"]{
  --bg:#0B1020; --surface:#131A2E; --sunk:#1B2339; --ink:#E8ECF7; --muted:#97A0BC; --line:#252F4A;
  --blue:#5C82FF; --blue-deep:#3F66F0; --blue-soft:#1C2A55; --tang:#FF7E45; --tang-soft:#3A2218;
  --violet:#9A82FF; --violet-soft:#2A2350; --amber:#FFB534; --amber-soft:#3A2D10;
  --mint:#2FCB97; --mint-soft:#103629; --sky:#3DB5F0; --sky-soft:#0F2C3D; --pink:#F2679F;
  --danger:#FF5A5E; --danger-soft:#3D1A1D; --shadow:none; color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root[data-tema="auto"]{
  --bg:#0B1020; --surface:#131A2E; --sunk:#1B2339; --ink:#E8ECF7; --muted:#97A0BC; --line:#252F4A;
  --blue:#5C82FF; --blue-deep:#3F66F0; --blue-soft:#1C2A55; --tang:#FF7E45; --tang-soft:#3A2218;
  --violet:#9A82FF; --violet-soft:#2A2350; --amber:#FFB534; --amber-soft:#3A2D10;
  --mint:#2FCB97; --mint-soft:#103629; --sky:#3DB5F0; --sky-soft:#0F2C3D; --pink:#F2679F;
  --danger:#FF5A5E; --danger-soft:#3D1A1D; --shadow:none; color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none!important}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:12px 16px 0}

/* topo */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand i{width:28px;height:18px;position:relative;display:inline-block}
.brand i:before,.brand i:after{content:"";position:absolute;top:2px;width:7px;height:14px;border-radius:3px;background:var(--tang)}
.brand i:before{left:0}.brand i:after{right:0}
.brand i b{position:absolute;left:5px;right:5px;top:7px;height:4px;border-radius:2px;background:var(--blue)}
.sync{font:600 12px var(--f-num);color:var(--muted);display:flex;align-items:center;gap:5px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--mint)}.sync.sv .dot{background:var(--amber)}.sync.er .dot{background:var(--danger)}
.top .sp{flex:1}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px}

/* barra de lançar */
.barra{display:flex;gap:8px}
.barra textarea{flex:1;min-width:0;height:48px;max-height:140px;resize:none;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;font-size:16px;line-height:1.35;box-shadow:var(--shadow)}
.barra textarea:focus{outline:0;border-color:var(--blue)}
.barra .go{border-radius:14px;padding:0 18px;background:var(--blue);color:#fff;font-weight:700;min-width:84px}
.barra .go:disabled{background:var(--sunk);color:var(--muted)}
.pv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px;margin:8px 0 12px;font-size:13px}
.pv .hint{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;background:var(--sunk);font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.b{background:var(--blue-soft);color:var(--blue)}.pill.o{background:var(--tang-soft);color:var(--tang)}.pill.g{background:var(--mint-soft);color:var(--mint)}
.pill.y{background:var(--amber-soft);color:#9A6500}.pill.v{background:var(--violet-soft);color:var(--violet)}.pill.r{background:var(--danger-soft);color:var(--danger)}
:root[data-tema="escuro"] .pill.y{color:var(--amber)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}

/* grade */
.grid{display:grid;gap:14px}
@media (min-width:900px){.grid.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.col{display:grid;gap:14px;align-content:start;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ph h2{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.ph h2:before{content:"";width:9px;height:9px;border-radius:3px;background:var(--hc,var(--blue))}
.act{color:var(--blue);font-weight:700;font-size:13px}
.note{color:var(--muted);font-size:13px;margin:6px 0 0}
.lnk{color:var(--blue);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.lnk.r{color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.o{background:var(--tang);border-color:var(--tang);color:#fff}.btn.g{background:var(--mint);border-color:var(--mint);color:#fff}
.btn.w{width:100%}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:15px}
input.in:focus,select.in:focus,textarea.in:focus{outline:0;border-color:var(--blue)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}

/* plano da semana */
.plano{background:linear-gradient(180deg,var(--tang-soft),var(--surface) 70%);border-color:color-mix(in srgb,var(--tang) 25%,var(--line))}
.plano-min{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left}
.plano-min small{display:block;color:var(--muted);font-size:12.5px}
.pl-l{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pl-l:first-of-type{border-top:0}
.pl-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--cc-soft,var(--sunk));color:var(--cc,var(--ink));font-size:14px}
.pl-n{font-weight:600}.pl-n small{color:var(--muted);font-weight:500;font-size:12px;margin-left:4px}
.pl-v{font-size:13px;color:var(--muted);white-space:nowrap}.pl-v b{color:var(--ink)}
.pl-v button{color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px}
.pl-bar{grid-column:2/4;height:6px;border-radius:6px;background:var(--sunk);overflow:hidden;position:relative}
.pl-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--cc,var(--blue))}
.pl-bar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.35}
.inl{display:inline-flex;gap:4px;align-items:center}.inl input{width:70px;padding:5px 8px;border:1.5px solid var(--blue);border-radius:8px;background:var(--surface);font:600 14px var(--f-num)}
.inl button{border-radius:8px;background:var(--blue);color:#fff;font-weight:700;padding:5px 9px;font-size:13px}

/* hero do treino */
.hero{display:flex;gap:16px;align-items:center}
.ring{position:relative;flex:0 0 76px;height:76px}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 17px var(--f-num)}
.hero h3{margin:2px 0 4px;font-size:19px;line-height:1.2}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tang)}
.chips{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.pchip{flex:1;min-width:64px;border:1.5px solid var(--line);border-radius:14px;padding:9px 6px;text-align:center;background:var(--surface);position:relative}
.pchip b{display:block;font-size:18px;font-weight:800}.pchip small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}.pchip[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.pchip.feito:after{content:"✓";position:absolute;top:4px;right:7px;font-size:11px;color:var(--mint);font-weight:800}
.pchip[aria-pressed="true"].feito:after{color:#fff}

/* exercícios */
.ex{border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden;background:var(--surface);position:relative}
.ex:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.ex.parcial:before{background:var(--amber)}.ex.done:before{background:var(--mint)}
.ex-h{display:flex;gap:10px;align-items:flex-start;padding:12px 12px 6px 16px}
.ex-n{font:600 12px var(--f-num);color:var(--tang);padding-top:3px}
.ex-t{flex:1;min-width:0}.ex-t b{font-size:15.5px;line-height:1.25;display:block}
.ex-t b button{text-align:left;text-decoration:underline dotted var(--line);text-underline-offset:4px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{font:500 11px var(--f-num);color:var(--muted);background:var(--sunk);border-radius:999px;padding:2px 8px}
.tag.hot{background:var(--tang-soft);color:var(--tang)}.tag.ok{background:var(--mint-soft);color:var(--mint)}.tag.pr{background:var(--amber-soft);color:#9A6500;font-weight:700}
.ex-note{font-size:12.5px;color:var(--muted);margin-top:5px}
.ex-acts{display:flex;gap:6px}
.icb{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px;text-decoration:none;background:var(--surface)}
.last{font:12px var(--f-num);color:var(--muted);padding:0 12px 6px 40px}.last b{color:var(--blue);font-weight:500}
.sug{font-size:12.5px;color:var(--mint);padding:0 12px 6px 40px;font-weight:600}
.sets{padding:2px 12px 10px 40px;display:grid;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:6px;align-items:center}.set.bw{grid-template-columns:22px 1fr 44px}
.set .lb{font:12px var(--f-num);color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;text-align:center;padding:9px 4px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font:500 15px var(--f-num)}
.set input:focus{outline:0;border-color:var(--blue)}
.tick{height:40px;border-radius:10px;border:1.5px solid var(--line);color:var(--line);font-weight:800;font-size:16px;background:var(--surface)}
.tick.on{background:var(--mint);border-color:var(--mint);color:#fff}
.ex-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 12px 12px 40px}
.mini{font-size:12px;font-weight:700;color:var(--blue);border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)}
.cmt{flex:1;min-width:140px;font-size:13px;padding:7px 10px;border:1px dashed var(--line);border-radius:8px;background:transparent}

/* listas */
.li{display:grid;grid-template-columns:minmax(0,1fr) auto 30px;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:600;min-width:0}.li .t small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.li .v{font:600 14px var(--f-num);text-align:right}
.li .x{width:28px;height:28px;border-radius:8px;color:var(--muted)}.li .x:hover{background:var(--danger-soft);color:var(--danger)}
.li.btnli{cursor:pointer}
.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:8px;background:var(--blue-soft);color:var(--blue);font-weight:800;font-size:12px;margin-right:8px;padding:0 6px}
.badge.c{background:var(--tang-soft);color:var(--tang)}

/* stats e gráficos */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:700 20px var(--f-num)}.stat small{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
svg.chart{width:100%;height:170px;display:block;margin-top:6px;overflow:visible}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal span{text-align:center;font:600 10.5px var(--f-num);color:var(--muted)}
.cal button{aspect-ratio:1;border-radius:9px;background:var(--sunk);font:500 12px var(--f-num);color:var(--muted);position:relative}
.cal button.has{background:var(--blue-soft);color:var(--blue);font-weight:700}
.cal button.cardio{background:var(--tang-soft);color:var(--tang);font-weight:700}
.cal button.has.cardio{background:linear-gradient(135deg,var(--blue-soft) 50%,var(--tang-soft) 50%)}
.cal button.hoje{outline:2px solid var(--blue);outline-offset:-2px}
.cal button.vz{visibility:hidden}

/* comida */
.check{display:grid}
.ck{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.ck:last-child{border-bottom:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.ck.on .box{background:var(--mint);border-color:var(--mint)}.ck.on .ckt{color:var(--muted);text-decoration:line-through}
.ckt small{display:block;color:var(--muted);font-size:12px;text-decoration:none}
.agua{display:flex;gap:6px}.agua button{flex:1;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface)}
.agua button.on{background:linear-gradient(180deg,#7BC8F5,var(--sky));border-color:var(--sky)}
.bar{height:7px;border-radius:7px;background:var(--sunk);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:7px;background:var(--cc,var(--blue))}
.meal{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.meal-h{display:flex;align-items:center;gap:8px}.meal-h b{flex:1}
.hh{font:600 12px var(--f-num);color:var(--tang);background:var(--tang-soft);border-radius:999px;padding:2px 8px}
.fi{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;text-align:left;width:100%}
.fi .box{width:22px;height:22px;border-radius:7px}.fi.on .box{background:var(--mint);border-color:var(--mint)}.fi.on .ft{color:var(--muted);text-decoration:line-through}
.fp{font:600 12px var(--f-num);color:var(--tang)}
.daybar{display:flex;align-items:center;gap:10px;margin-bottom:12px}.daybar div{flex:1;text-align:center}.daybar b{display:block;text-transform:capitalize}.daybar small{color:var(--muted);font-size:12px}
.streak{display:flex;gap:3px}.streak button{flex:1;height:28px;border-radius:6px;background:var(--sunk)}

/* IA */
.ins{display:grid;gap:8px}
.ins-i{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:12px;background:var(--violet-soft)}
.ins-i.alerta{background:var(--danger-soft)}.ins-i.elogio{background:var(--mint-soft)}.ins-i.projecao{background:var(--blue-soft)}
.ins-ic{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--surface);font-weight:800}
.ins-i p{margin:3px 0 0;font-size:13.5px}.ins-i small{display:block;margin-top:4px;font-weight:600}
.ask{display:flex;gap:8px;margin-top:10px}.ask input{flex:1;min-width:0}
.resp{white-space:pre-wrap;font-size:14px;margin-top:10px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.resp:empty{display:none}
.load{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.load:before{content:"";width:16px;height:16px;border-radius:50%;border:2.5px solid var(--violet-soft);border-top-color:var(--violet);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.iabox{border:1.5px dashed var(--violet);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;white-space:pre-wrap}
.iabox b{color:var(--violet)}

/* folha (sheet) */
#layer{position:fixed;inset:0;z-index:62;display:none}
#layer.on{display:block}
#layer .bk{position:absolute;inset:0;background:rgba(10,15,30,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media (min-width:700px){.sheet{bottom:auto;top:6vh;border-radius:20px;max-height:88vh}}
.sheet h3{margin:0 0 4px;font-size:18px}
.box-i{background:var(--sunk);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
.box-i .il{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:3px}
.box-i.err .il{color:var(--danger)}.box-i.ia{background:var(--violet-soft)}.box-i.ia .il{color:var(--violet)}
.opt{display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;margin-top:6px;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}

/* timer, toast, convites */
#timer{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto;z-index:50;background:var(--tang);color:#fff;border-radius:16px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;box-shadow:0 12px 30px -10px rgba(255,106,43,.6)}
#timer.on{display:flex}#timer b{font:700 26px var(--f-num)}#timer small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}

/* ---------- dados ---------- */
let D=null, plano='A', log={}, swaps={}, notas={}, editP='A';
function defaults(){
  for(const k in SEED) if(D[k]===undefined) D[k]=structuredClone(SEED[k]);
  if(D._u===undefined) D._u=0;
  if((D.refVer||0) < SEED.refVer){ D.refeicoes=structuredClone(SEED.refeicoes); D.refVer=SEED.refVer; }
  if((D.planVer||0) < SEED.planVer){ D.plans=structuredClone(SEED.plans); D.planVer=SEED.planVer; }
  D.atividades ||= []; D.pesos ||= []; D.sessions ||= []; D.dias ||= {};
}
function persist(){ D.rascunho={data:hoje(),plano,log,swaps,notas}; save(); }
function restaurarRascunho(){ const r=D.rascunho; if(r && r.data===hoje()){ log=r.log||{}; swaps=r.swaps||{}; notas=r.notas||{}; if(r.plano) plano=r.plano; } else { D.rascunho=null; log={}; swaps={}; notas={}; } }
let sT;
function save(){ D._u = Date.now(); clearTimeout(sT); sT=setTimeout(()=>lsSet(KEY,JSON.stringify(D)),150); cloudPush(); }
async function load(){
  try{ D=JSON.parse(lsGet(KEY)); if(!D) throw 0; }catch(e){ D=structuredClone(SEED); D._u=0; }
  defaults(); restaurarRascunho(); setSync('entrando'); iniciarConta();
}
async function iniciarConta(){
  try{ await comPrazo(carregarFirebase(), 15000); }catch(e){ setSync('off'); S.authPronto = true; S.contaErro = 'rede'; render(); return; }
  const t = setTimeout(()=>{ if (!S.authPronto){ S.authPronto = true; setSync('off'); render(); } }, 9000);
  FB.authM.onAuthStateChanged(FB.auth, u=>{ clearTimeout(t); S.user = u||null; S.authPronto = true; S.contaErro = null; if (u) conectarNuvem(u); else { FB.desl?.(); nuvemRef = null; setSync('off'); } render(); });
}
function conectarNuvem(u){
  FB.desl?.(); nuvemRef = FB.fsM.doc(FB.db, `caderneta/${u.uid}/treino/caderno`); setSync('sync');
  let primeira = true; const t = setTimeout(()=>{ if (primeira){ setSync('err'); toast('A nuvem não respondeu ainda. Seus treinos ficam salvos aqui e sobem quando a conexão voltar.'); } }, 12000);
  FB.desl = FB.fsM.onSnapshot(nuvemRef, async snap=>{
    clearTimeout(t);
    if (snap.exists()){ const c = snap.data();
      if ((c._u||0) > (D._u||0)){ try{ D = JSON.parse(c.payload); defaults(); lsSet(KEY, JSON.stringify(D)); restaurarRascunho(); if (!planosVisiveis().some(p=>p.id===plano)) plano = proximo(); render(); }catch(e){} }
      else if ((D._u||0) > (c._u||0) && primeira) cloudPush();
      if (!snap.metadata.hasPendingWrites) setSync('ok'); }
    else if (primeira){
      if (sync.code){ const velho = await puxarCodigoAntigo(sync.code); if (velho && (velho._u||0) > (D._u||0)){ D = velho; defaults(); restaurarRascunho(); render(); } }
      D._u = Date.now(); lsSet(KEY, JSON.stringify(D)); cloudPush(); toast('Pronto: seus treinos agora ficam salvos na sua conta.'); }
    primeira = false;
  }, err=>{ clearTimeout(t); setSync('err'); S.contaErro = /permission/i.test(String(err.code||err.message)) ? 'permissao' : 'rede'; render(); });
}
async function entrarGoogle(){ try{ await carregarFirebase(); await FB.authM.signInWithPopup(FB.auth, new FB.authM.GoogleAuthProvider(), FB.authM.browserPopupRedirectResolver); }catch(e){ toast(/popup-closed|cancelled/i.test(e.code||'') ? 'Login cancelado. No celular, tente “Entrar com e-mail”.' : 'Não consegui entrar com o Google agora.', null, 7000); } }
async function entrarEmail(email, senha){ try{ await carregarFirebase(); await comPrazo(FB.authM.signInWithEmailAndPassword(FB.auth, email, senha), 15000); fecharFolha(); toast('Pronto, você entrou.'); }catch(e){ toast(/invalid|wrong|not-found|credential/i.test(e.code||'') ? 'E-mail ou senha não conferem. É a mesma senha da Caderneta.' : 'Não consegui entrar agora. Confira a internet.', null, 7000); } }
/* desfazer universal: guarda uma foto dos dados antes da ação */
function comDesfazer(msg, fn){ const antes = JSON.stringify(D); const r = fn(); save(); render(); toast(typeof msg==='function' ? msg(r) : msg, ()=>{ D = JSON.parse(antes); defaults(); restaurarRascunho(); save(); render(); toast('Desfeito'); }); return r; }

/* ---------- toast ---------- */
let toastT;
function toast(msg, desfazer, ms){ const t=$('#toast'); $('#toastT').textContent=msg; const b=$('#toastB'); b.hidden=!desfazer; b.onclick=()=>{ t.classList.remove('on'); desfazer&&desfazer(); };
  t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'), ms||(desfazer?7000:3500)); }

/* ---------- treino do dia ---------- */
const getPlan = id => (D.hojeCustom && D.hojeCustom.data===hoje() && id===D.hojeCustom.plano.id) ? D.hojeCustom.plano : (D.plans.find(p=>p.id===id)||D.plans[0]);
const planosVisiveis = () => (D.hojeCustom && D.hojeCustom.data===hoje()) ? [D.hojeCustom.plano, ...D.plans] : D.plans;
function proximo(){ const ult=[...D.sessions].reverse().find(s=>D.plans.some(p=>p.id===s.plano)); const ord=D.plans.map(p=>p.id); if(!ult) return ord[0]; return ord[(ord.indexOf(ult.plano)+1)%ord.length]; }
function nSeries(e){ return Math.max(e.series, (log[e.id]||[]).length); }
function sugSet(nome,s){ for(let i=D.sessions.length-1;i>=0;i--){ const it=D.sessions[i].itens.find(x=>x.nome===nome); if(it&&it.sets.length){ const v=it.sets[s]||it.sets[it.sets.length-1]; return {kg:v.kg,reps:v.reps}; } } return {}; }
function ultima(nome){ for(let i=D.sessions.length-1;i>=0;i--){ const it=D.sessions[i].itens.find(x=>x.nome===nome); if(it&&it.sets.length) return {txt: it.sets.map(s=>it.bw?`${s.reps??'–'}`:`${s.kg??'–'}×${s.reps??'–'}`).join('  ')+`  (${br(D.sessions[i].data)})`, it, data:D.sessions[i].data}; } return null; }
const topReps = r => { const m = String(r||'').match(/(\d+)\s*(?:–|-|a)\s*(\d+)/); if (m) return +m[2]; const n = parseInt(r); return isFinite(n) ? n : null; };
const e1rm = (kg,reps) => (kg>0 && reps>0) ? kg*(1+reps/30) : 0;
function melhor1rm(nome, ate){ let b=0; for(const s of D.sessions){ if (ate && s.data>=ate) continue; for(const it of s.itens) if(it.nome===nome) for(const x of it.sets) b=Math.max(b, e1rm(x.kg||0, x.reps||0)); } return b; }
/* sugestão de progressão: fechou o topo das reps em todas as séries → sobe a carga */
function sugestaoCarga(e, nome){ if (e.bw) return null; const u = ultima(nome); if(!u) return null; const top = topReps(e.reps); const sets = u.it.sets.filter(x=>x.kg);
  if (!top || sets.length < Math.min(2, e.series)) return null;
  const kg = Math.max(...sets.map(x=>x.kg)); const fechou = sets.every(x=>(x.reps||0) >= top);
  const dias = (Date.now() - new Date(u.data+'T12:00:00'))/864e5;
  if (dias > 21) return {tipo:'volta', kg: Math.round(kg*0.85*2)/2, txt:`Faz ${Math.round(dias)} dias: comece com ~${f1(Math.round(kg*0.85*2)/2)} kg (85%) e sinta`};
  if (fechou) { const inc = kg>=40 ? 2.5 : kg>=12 ? 2 : 1; return {tipo:'sobe', kg: kg+inc, txt:`Você fechou ${top} reps em tudo: suba para ${f1(kg+inc)} kg`}; }
  return null; }

/* ---------- semana ---------- */
const ehBola = a => /futebol|bola|pelada|futsal|society/i.test(a.esporte||'');
const ehCorre = a => /corr|camin|trot|run/i.test(a.esporte||'');
function semanaDados(w){ const fim = addDias(w,6), dentro = k => k>=w && k<=fim;
  const musc = D.sessions.filter(s=>dentro(s.data)).length;
  const at = D.atividades.filter(a=>dentro(a.data));
  const km = sum(at.filter(ehCorre), a=>+a.km||0), bola = at.filter(ehBola).length, min = sum(at, a=>+a.min||0);
  const dias = []; for (let i=0;i<7;i++){ const k = addDias(w,i); if (k<=hoje()) dias.push(k); }
  const agua = dias.length ? sum(dias, k=>(D.dias[k]?.agua)||0)/dias.length : 0;
  const prot = dias.length ? sum(dias, k=>protDia(k))/dias.length : 0;
  return {musc, km, bola, min, agua, prot, dias:dias.length};
}
function metaSemana(){ if (D.metaSem) return D.metaSem; const ws = [1,2,3,4].map(k=>semanaDados(addDias(segunda(),-7*k)));
  const media = f => ws.reduce((s,x)=>s+f(x),0)/ws.length;
  return { treinos: Math.max(3, Math.round(media(x=>x.musc))||3), km: Math.round(media(x=>x.km))||0, bola: Math.round(media(x=>x.bola))||0, agua: 8, prot: D.protAlvo||120 }; }

/* ---------- comida: proteína do dia ---------- */
const protDe = t => { const m=String(t).match(/~\s*(\d+)\s*g/); return m && +m[1] <= 90 ? +m[1] : 0; };
function diaDe(k){ const d=D.dias[k]||(D.dias[k]={feito:[],agua:0,nota:''}); if(!d.comido)d.comido=[]; if(!d.mealEat)d.mealEat={}; if(d.kcalExtra===undefined)d.kcalExtra=0; return d; }
function protDia(k){ const d = D.dias[k]; if (!d) return 0; let p = 0; D.refeicoes.forEach(r=>{ (d.mealEat?.[r.id]||[]).forEach(x=>p+=(+x.p||0)); r.itens.forEach((it,i)=>{ if ((d.comido||[]).includes(r.id+'#'+i)) p+=protDe(it); }); }); return p; }
function refeicaoAgora(){ const h = new Date().getHours()*60+new Date().getMinutes(); const rs = D.refeicoes.map(r=>{ const [hh,mm] = String(r.hora||'12:00').split(':').map(Number); return {r, d: Math.abs((hh*60+(mm||0))-h)}; }).sort((a,b)=>a.d-b.d); return rs[0]?.r || D.refeicoes[0]; }

/* ---------- barra: entende o que você escreve ---------- */
const ESPORTES = [[/corr(i|ida|er)|trot|run\b/,'Corrida'],[/camin(hei|hada)/,'Caminhada'],[/futebol|bola|pelada|futsal|society/,'Futebol'],[/pedal|bike|bicicleta|ciclismo/,'Bike'],[/nad(ei|ar|o)|natac/,'Natação'],[/funcional|crossfit/,'Funcional'],[/alonga|yoga|mobilidade/,'Alongamento']];
function acharExercicio(txt){ const n = norm(txt); const p = getPlan(plano); const todos = [...p.ex, ...D.plans.flatMap(x=>x.ex)];
  let best = null, bs = 0;
  for (const e of todos){ const nome = norm(swaps[e.id]||e.nome); const ws = nome.split(/[^a-z0-9]+/).filter(w=>w.length>2 && !['com','sem','para','livre','maquina','barra','halteres','halter','sentado','polia'].includes(w));
    let sc = 0; ws.forEach((w,i)=>{ if (new RegExp('\\b'+w.slice(0, Math.max(4, w.length-2))).test(n)) sc += i===0 ? 3 : 1; });
    if (p.ex.includes(e)) sc += 0.5; if (sc > bs){ bs = sc; best = e; } }
  return bs >= 3 ? best : null; }
function parseDur(t){ let m = t.match(/(\d+)\s*h\s*(\d+)?/i); if (m) return (+m[1])*60 + (+m[2]||0); m = t.match(/(\d+)\s*(min|minutos?|m\b)/i); if (m) return +m[1]; m = t.match(/(\d+):(\d{2})/); if (m) return +m[1] + (+m[2])/60; return null; }
function parseLinha(raw){
  const t = raw.trim(); if (!t) return null; const n = norm(t);
  let m;
  if ((m = n.match(/\b(peso|pesei|balanca)\b[^\d]*(\d{2,3}(?:[.,]\d+)?)/)) || (m = n.match(/^(\d{2,3}[.,]\d)\s*kg$/))) return {tipo:'peso', kg: num(m[2]||m[1]), txt:t};
  if (/\bagua\b|\bcopos?\b|\bgarrafa/.test(n)){ let c = 1; if ((m = n.match(/(\d+[.,]?\d*)\s*(l|litros?)\b/))) c = Math.round(num(m[1])*1000/300); else if ((m = n.match(/(\d+)\s*ml/))) c = Math.round(+m[1]/300); else if ((m = n.match(/(\d+)\s*(copos?|garrafas?)/))) c = +m[1] * (/garraf/.test(m[2]) ? 2 : 1); else if ((m = n.match(/(\d+)/))) c = +m[1]; return {tipo:'agua', copos: Math.max(1, Math.min(12, c)), txt:t}; }
  if ((m = n.match(/\bdormi\b[^\d]*(\d+[.,]?\d*)\s*h?/))) return {tipo:'sono', h: num(m[1]), txt:t};
  for (const [re, esporte] of ESPORTES) if (re.test(n)){ const km = (m = n.match(/(\d+[.,]?\d*)\s*km/)) ? num(m[1]) : null; const min = parseDur(n.replace(/(\d+[.,]?\d*)\s*km/,'')); const kcal = (m = n.match(/(\d+)\s*kcal/)) ? +m[1] : null; if (!km && !min) return {tipo:'atividade', esporte, min: esporte==='Futebol'?60:null, km:null, txt:t, incompleto:true}; return {tipo:'atividade', esporte, km, min, kcal, txt:t}; }
  if (/\b(comi|almocei|jantei|lanchei|cafe da manha|tomei|whey|ovos?|frango|carne|peixe)\b/.test(n) && !/\b\d+\s*kg\b/.test(n)){ const p = (m = n.match(/(\d+)\s*g\s*(de\s*)?(prot|proteina)/)) ? +m[1] : (m = n.match(/~\s*(\d+)\s*g/)) ? +m[1] : null; return {tipo:'comida', t: t.replace(/^(comi|almocei|jantei|lanchei|tomei)\s+/i,''), p, txt:t}; }
  const ex = acharExercicio(t);
  if (ex){ const sets = []; let kgBase = null;
    const pares = [...n.matchAll(/(\d+[.,]?\d*)\s*(?:kg)?\s*[x×]\s*(\d+)/g)];
    const sx = n.match(/(\d+)\s*[x×]\s*(\d+)\s*(?:de|com|a)?\s*(\d+[.,]?\d*)\s*kg/);
    if (sx){ for (let i=0;i<+sx[1];i++) sets.push({kg:num(sx[3]), reps:+sx[2]}); }
    else if (pares.length && /kg|[x×]/.test(n) && pares.every(p=>num(p[1])>=+p[2]/2 || /kg/.test(n))){ pares.forEach(p=>sets.push({kg:num(p[1]), reps:+p[2]})); }
    else { kgBase = (m = n.match(/(\d+[.,]?\d*)\s*kg/)) ? num(m[1]) : null; const resto = n.replace(/(\d+[.,]?\d*)\s*kg/,' '); const reps = [...resto.matchAll(/\b(\d{1,2})\b/g)].map(x=>+x[1]).filter(x=>x>0 && x<=60); reps.forEach(r=>sets.push({kg: ex.bw ? null : kgBase, reps:r})); if (!sets.length && kgBase) sets.push({kg:kgBase, reps:null}); }

}
function parseTexto(v){ const partes = String(v||'').split(/\n|;|\s+e\s+(?=[a-zà-ú])|,\s*(?=[a-zà-ú]{3,})/i).map(x=>x.trim()).filter(Boolean); const itens = [], falhas = []; for (const p of partes){ const r = parseLinha(p); if (r) itens.push(r); else falhas.push(p); } return {itens, falhas}; }
function descItem(it){ return it.tipo==='peso' ? `peso ${f1(it.kg)} kg` : it.tipo==='agua' ? `+${it.copos} ${it.copos>1?'copos':'copo'} de água` : it.tipo==='sono' ? `dormiu ${f1(it.h)} h` : it.tipo==='atividade' ? `${it.esporte}${it.km?` ${f1(it.km)} km`:''}${it.min?` ${Math.round(it.min)} min`:''}${it.km&&it.min&&ehCorre(it)?` · ${ritmo(it.min,it.km)}/km`:''}` : it.tipo==='comida' ? `comeu ${it.t}${it.p?` · ${it.p} g prot`:''}` : `${swaps[it.ex.id]||it.ex.nome}: ${it.sets.map(s=>it.ex.bw||s.kg==null?`${s.reps??'?'}`:`${f1(s.kg)}×${s.reps??'?'}`).join(' ')}`; }
const ritmo = (min, km) => { const p = min/km; const mm = Math.floor(p), ss = Math.round((p-mm)*60); return `${mm}:${pad(ss)}`; };
function aplicarItens(itens){
  let resumo = [];
  for (const it of itens){
    if (it.tipo==='peso'){ const i = D.pesos.findIndex(p=>p.data===hoje()); i>=0 ? D.pesos[i].kg = it.kg : D.pesos.push({data:hoje(), kg:it.kg}); D.pesos.sort((a,b)=>a.data<b.data?-1:1); }
    else if (it.tipo==='agua'){ const d = diaDe(hoje()); d.agua = Math.min(12, (d.agua||0) + it.copos); }
    else if (it.tipo==='sono'){ diaDe(hoje()).sono = it.h; }
    else if (it.tipo==='atividade'){ D.atividades.push({id:uid(), data:hoje(), esporte:it.esporte, km:it.km||null, min:it.min||null, kcal:it.kcal||null, nota:'', ts:Date.now()}); }
    else if (it.tipo==='comida'){ const r = refeicaoAgora(); const d = diaDe(hoje()); (d.mealEat[r.id] ||= []).push({id:uid(), t:it.t, p:it.p||0}); }
    else if (it.tipo==='series'){ const e = it.ex; if (!getPlan(plano).ex.includes(e)){ const dono = D.plans.find(p=>p.ex.includes(e)); if (dono) plano = dono.id; }
      log[e.id] = (log[e.id]||[]).filter(s=>s && s.ok); const ini = log[e.id].length;
      it.sets.forEach((s,i)=>{ log[e.id][ini+i] = {kg: s.kg!=null ? String(s.kg) : undefined, reps: s.reps!=null ? String(s.reps) : undefined, ok:true}; });
      const nome = swaps[e.id]||e.nome; const best = melhor1rm(nome, hoje()); const hojeMax = Math.max(0, ...it.sets.map(s=>e1rm(s.kg||0, s.reps||0)));
      if (best && hojeMax > best + 0.01) resumo.push(`recorde em ${nome}!`);
      D.rascunho = {data:hoje(), plano, log, swaps, notas}; }

/* ---------- IA (Gemini pelo Firebase AI Logic, sempre em streaming) ---------- */
function jsonSolto(t){ t = String(t||'').trim(); try{ return JSON.parse(t); }catch(e){} const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f){ try{ return JSON.parse(f[1]); }catch(e){} } const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf(']'), t.lastIndexOf('}')); if (a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} } const err = new Error('json'); err.code='invalid_json'; throw err; }
function criarIA(){
  const MODELOS = ["gemini-3.8-flash","gemini-3-flash-preview","gemini-flash-latest","gemini-3.5-flash-lite"];
  let idx = Math.max(0, MODELOS.indexOf(lsGet('caderno:modelo'))); let M = null;
  async function modelo(json){
    if (!M){ const [appM, aiM] = await Promise.all([import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-app.js`), import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-ai.js`)]);
      const app = appM.getApps().find(a=>a.name==='caderneta') || appM.initializeApp(IA_CFG, 'caderneta'); M = {aiM, ai: aiM.getAI(app, {backend: new aiM.GoogleAIBackend()})}; }
    return M.aiM.getGenerativeModel(M.ai, {model: MODELOS[idx], generationConfig: json ? {responseMimeType:'application/json'} : {}});
  }
  async function tentar(json, fn){ let ultimo;
    for (let i=0;i<MODELOS.length;i++){ try{ const r = await fn(await modelo(json)); lsSet('caderno:modelo', MODELOS[idx]); return r; }
      catch(e){ ultimo = e; const m = String(e?.message||e); if (e?.code==='invalid_json' || /quota|RESOURCE_EXHAUSTED|429|SERVICE_DISABLED|API key/i.test(m)) throw e; if (idx < MODELOS.length-1){ idx++; continue; } throw e; } }
    throw ultimo; }
  const stream = async (m, conteudo, onT) => { const r = await m.generateContentStream(conteudo); let t=''; for await (const c of r.stream){ t += c.text(); onT && onT(t); } return t; };
  return {
    json: (prompt, onT) => tentar(true, async m => jsonSolto(await stream(m, prompt, onT))),
    texto: (prompt, onT) => tentar(false, m => stream(m, prompt, onT)),
    erro: e => { const m = String(e?.message||e); if (e?.code==='invalid_json') return 'A resposta veio confusa. Tente de novo.'; if (/quota|429|RESOURCE/i.test(m)) return 'Limite grátis da IA atingido por agora. Tente mais tarde.'; if (/fetch|network|Load failed|tempo/i.test(m)) return 'A conexão caiu no meio da resposta. Tente de novo com a tela acesa.'; return 'A IA não respondeu agora. Tente de novo.'; }
  };
}

    ['km',ic('corre'),'Corrida', sd.km, mt.km, 'km', 'var(--tang)','var(--tang-soft)'],
    ['bola',ic('bola'),'Futebol', sd.bola, mt.bola, 'vezes', 'var(--mint)','var(--mint-soft)'],
    ['agua',ic('agua'),'Água', sd.agua, mt.agua, 'copos/dia', 'var(--sky)','var(--sky-soft)'],
    ['prot',ic('prot'),'Proteína', sd.prot, mt.prot, 'g/dia', 'var(--violet)','var(--violet-soft)'] ].filter(l=>l[4]>0 || l[3]>0);
  const resumo = `${sd.musc}/${mt.treinos} treinos${mt.km?` · ${f1(sd.km)}/${mt.km} km`:''}${mt.bola?` · ${sd.bola}/${mt.bola} futebol`:''}`;
  if (!semanaAberta(w)) return `<section class="panel plano"><button class="plano-min" data-act="semanaAbre"><span><b>Plano da semana</b><small>${resumo}</small></span><span style="color:var(--tang);font-size:18px">▾</span></button></section>`;
  const ed = memo.get('edMeta');
  return `<section class="panel plano"><div class="ph"><h2 style="--hc:var(--tang)">Plano da semana</h2><span style="display:flex;gap:10px;align-items:center"><span class="note" style="margin:0">desde ${br(w)}</span><button class="ib" style="width:30px;height:28px;border-radius:8px" data-act="semanaFecha" aria-label="Minimizar">▴</button></span></div>
    ${linhas.map(([k,ic,nome,v,meta,un,cc,cs])=>{ const pc = meta ? Math.min(100, v/meta*100) : 0; const media = k==='agua'||k==='prot';
      return `<div class="pl-l" style="--cc:${cc};--cc-soft:${cs}"><span class="pl-ic">${ic}</span><span class="pl-n">${nome}<small>${un}</small></span>
        <span class="pl-v">${ed===k?`<span class="inl"><input id="metaIn" inputmode="decimal" value="${meta}"><button data-act="metaOk:${k}">OK</button></span>`:`<b class="num">${k==='km'?f1(v):Math.round(v)}</b> ${meta?`de <button class="num" data-act="metaEd:${k}" title="Mudar a meta">${meta}</button>`:`<button data-act="metaEd:${k}">definir meta</button>`}`}</span>
        <div class="pl-bar"><i style="width:${pc.toFixed(0)}%"></i>${media?'':`<s style="left:${(passou*100).toFixed(0)}%"></s>`}</div></div>`; }).join('')}
    <p class="note">Metas vêm do seu histórico. Toque no número da meta para mudar. O risquinho marca onde a semana está.</p></section>`;
}

const ic = (n, s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;

/* valor que aparece numa série ainda não feita: o que você mexeu > série anterior de hoje > sugestão > última vez */
function valorSerie(e, s){ const nome = swaps[e.id]||e.nome, v = (log[e.id]||[])[s]||{}; const ant = (log[e.id]||[])[s-1]; const sg = sugestaoCarga(e, nome), u = sugSet(nome, s);
  const kg = v.kg!=null && v.kg!=='' ? num(v.kg) : ant && ant.ok && ant.kg!=null ? num(ant.kg) : sg ? sg.kg : u.kg!=null ? u.kg : (e.kgSug ?? null);
  const reps = v.reps!=null && v.reps!=='' ? num(v.reps) : ant && ant.ok && ant.reps!=null ? num(ant.reps) : u.reps!=null ? u.reps : (topReps(e.reps) || 10);
  return {kg, reps, ok: !!v.ok}; }
function progressoEx(e){ const ns = nSeries(e), n = (log[e.id]||[]).filter(s=>s&&s.ok).length; return {ns, n: Math.min(n, ns)}; }
function minutosTreino(p){ return Math.round(sum(p.ex, e=>e.series*(0.75 + e.rest/60)) + 5); }

function blocoTreino(){
  const vis = planosVisiveis(); if (!vis.some(p=>p.id===plano)) plano = proximo();
  const p = getPlan(plano), feitos = D.sessions.filter(s=>s.data===hoje()).map(s=>s.plano);
  const tot = sum(p.ex, e=>progressoEx(e).ns), ok = sum(p.ex, e=>progressoEx(e).n), pct = tot ? Math.round(ok/tot*100) : 0;
  const custom = D.hojeCustom && D.hojeCustom.data===hoje() && plano==='Hoje';
  const ult = [...D.sessions].reverse().find(s=>s.plano===p.id); const parado = (()=>{ const u = D.sessions[D.sessions.length-1]; return u ? Math.round((Date.now()-new Date(u.data+'T12:00:00'))/864e5) : null; })();
  const R = 26, C = 2*Math.PI*R;
  const linhas = p.ex.map((e,i)=>{ const nome = swaps[e.id]||e.nome, pr = progressoEx(e), sg = sugestaoCarga(e, nome), v0 = valorSerie(e, 0);
    const alvo = `${e.series}×${e.reps}${e.tempo?'s':''}${!e.bw && v0.kg ? ` · ${f1(v0.kg)} kg` : e.bw ? ' · corpo' : ''}`;
    return `<button class="tr-ex ${pr.n>=pr.ns?'feito':pr.n?'meio':''}" data-act="foco:${i}">
      <span class="tr-n">${pr.n>=pr.ns ? ic('check',16) : i+1}</span>
      <span class="tr-t"><b>${esc(nome)}</b><small>${esc(alvo)}${sg && !pr.n ? ` <em class="${sg.tipo==='volta'?'volta':''}">${sg.tipo==='volta'?'volta leve':`↑ ${f1(sg.kg)} kg`}</em>` : ''}</small></span>
      <span class="tr-dots">${Array.from({length:pr.ns},(_,k)=>`<i class="${k<pr.n?'on':''}"></i>`).join('')}</span></button>`; }).join('');
  const comecou = ok > 0, acabou = tot && ok >= tot;
  return `<section class="panel treino">
    <div class="tr-top">
      <div class="tr-head"><div style="min-width:0"><div class="tr-eye">${feitos.includes(p.id)?'Já registrado hoje':custom?'Montado pelo coach':'Treino de hoje'}</div>
        <h3>${esc(p.id==='Hoje'?p.nome:p.nome)}</h3>
        <div class="tr-meta">${p.ex.length} exercícios · ~${minutosTreino(p)} min${ult?` · último em ${br(ult.data)}`:''}</div></div>
        <div class="tr-ring"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${R}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="7"/><circle cx="32" cy="32" r="${R}" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C - C*pct/100}" transform="rotate(-90 32 32)"/></svg><b>${pct}%</b></div></div>
      ${custom && D.hojeCustom.motivo ? `<div class="tr-msg">${esc(D.hojeCustom.motivo)}</div>` : parado!=null && parado>14 && !comecou ? `<div class="tr-msg">Faz ${parado} dias do último treino. <button data-act="perg:Voltei depois de ${parado} dias parado. Monta meu treino de hoje.">Pedir um treino de volta ao coach</button></div>` : ''}
      <div class="tr-seg" role="tablist">${vis.map(x=>`<button role="tab" aria-selected="${x.id===plano}" data-act="plano:${esc(x.id)}" class="${feitos.includes(x.id)?'feito':''}">${x.id==='Hoje'?'★ Coach':esc(x.id)}<small>${esc(x.id==='Hoje'?'hoje':x.nome.split('/')[0].trim())}</small></button>`).join('')}</div>
    </div>
    <div class="tr-lista">${linhas || '<p class="note">Sem exercícios neste treino. Ajuste em Treinos.</p>'}</div>
    <div class="tr-acoes">
      ${acabou ? `<button class="btn o w big" data-act="encerrar">Encerrar e salvar treino</button>` : `<button class="btn p w big" data-act="foco:${Math.max(0, p.ex.findIndex(e=>progressoEx(e).n < progressoEx(e).ns))}">${comecou?`Continuar · ${ok} de ${tot} séries`:'Começar treino'}</button>`}
      ${comecou && !acabou ? `<button class="lnk" data-act="encerrar">encerrar e salvar como está</button>` : ''}
      ${custom ? `<button class="lnk" data-act="tirarCustom">voltar para o treino normal</button>` : ''}
      ${comecou ? `<button class="lnk" data-act="limparHoje">limpar o que marquei</button>` : ''}
    </div></section>`;
}

/* ---------- MODO ACADEMIA: um exercício por vez, números grandes, um toque por série ---------- */
function abrirFoco(i){ const p = getPlan(plano); i = Math.max(0, Math.min(p.ex.length-1, i)); const e = p.ex[i]; if (!e) return;
  const pr = progressoEx(e); S.foco = {i, s: Math.min(pr.n, nSeries(e)-1)}; if (pr.n >= pr.ns) S.foco.s = pr.ns-1; document.body.classList.add('focando'); renderFoco(); }
function fecharFoco(){ S.foco = null; document.body.classList.remove('focando'); $('#foco').innerHTML=''; $('#foco').hidden = true; render(); }
function renderFoco(){
  const f = S.foco, box = $('#foco'); if (!f){ box.hidden = true; return; } const p = getPlan(plano), e = p.ex[f.i]; if (!e){ fecharFoco(); return; }
  box.hidden = false; const nome = swaps[e.id]||e.nome, ns = nSeries(e), v = valorSerie(e, f.s), u = ultima(nome), sg = sugestaoCarga(e, nome), pr = progressoEx(e);
  const descansando = tL > 0 && $('#timer').classList.contains('on');
  const best = melhor1rm(nome, hoje());
  box.innerHTML = `<div class="fo">
    <div class="fo-top"><button class="fo-ib" data-act="fecharFoco" aria-label="Fechar">${ic('x',20)}</button>
      <div class="fo-pos">${p.ex.map((x,k)=>{ const q = progressoEx(x); return `<button class="${k===f.i?'cur':''} ${q.n>=q.ns?'ok':q.n?'meio':''}" data-act="focoEx:${k}" aria-label="Exercício ${k+1}"></button>`; }).join('')}</div>
      <a class="fo-ib" href="${yt(nome)}" target="_blank" rel="noopener" aria-label="Ver execução">${ic('play',18)}</a></div>
    <div class="fo-ex"><div class="tr-eye" style="color:var(--tang)">Exercício ${f.i+1} de ${p.ex.length}</div>
      <h2><button data-act="info:${e.id}">${esc(nome)} ${ic('info',16)}</button></h2>
      <div class="fo-alvo">Alvo ${e.series}×${esc(e.reps)}${e.tempo?' s':''} · descanso ${e.rest}s <button class="lnk" data-act="swap:${e.id}">trocar</button></div>
      ${u?`<div class="fo-ult">Última vez: <b>${esc(u.txt)}</b></div>`:''}
      ${sg?`<div class="fo-sug ${sg.tipo}">${esc(sg.txt)}</div>`:''}
      ${e.nota?`<div class="fo-nota">${esc(e.nota)}</div>`:''}</div>
    <div class="fo-sets">${Array.from({length:ns},(_,s)=>{ const x = valorSerie(e,s); return `<button class="fo-set ${s===f.s?'cur':''} ${x.ok?'ok':''}" data-act="focoSet:${s}"><small>${s+1}ª</small>${x.ok||s===f.s?`<b>${e.bw?'':f1(x.kg??0)+'×'}${x.reps??'–'}</b>`:'<b>—</b>'}</button>`; }).join('')}<button class="fo-set add" data-act="maisSerie:${e.id}" aria-label="Mais uma série">${ic('mais',16)}</button></div>
    ${descansando ? `<div class="fo-desc"><div class="tr-eye" style="color:var(--tang)">Descanso</div><b id="fClock" class="num">${pad(Math.floor(tL/60))}:${pad(tL%60)}</b><div class="btns" style="justify-content:center"><button class="btn" data-act="timerMais">+30s</button><button class="btn o" data-act="timerPara">Pular descanso</button></div><p class="note">Próxima: ${f.s+1}ª série${pr.n>=pr.ns && p.ex[f.i+1] ? ` · ${esc(swaps[p.ex[f.i+1].id]||p.ex[f.i+1].nome)}`:''}</p></div>`
    : `<div class="fo-nums">
        ${e.bw?'':`<div class="fo-num"><label>Carga (kg)</label><div class="stp"><button data-act="stp:kg:-1" aria-label="Menos carga">${ic('menos',22)}</button><input id="foKg" inputmode="decimal" value="${v.kg!=null?String(v.kg).replace('.',','):''}" aria-label="Carga"><button data-act="stp:kg:1" aria-label="Mais carga">${ic('mais',22)}</button></div></div>`}
        <div class="fo-num"><label>${e.tempo?'Segundos':'Repetições'}</label><div class="stp"><button data-act="stp:reps:-1" aria-label="Menos">${ic('menos',22)}</button><input id="foReps" inputmode="numeric" value="${v.reps??''}" aria-label="Repetições"><button data-act="stp:reps:1" aria-label="Mais">${ic('mais',22)}</button></div></div></div>
      ${v.ok ? `<button class="fo-feita des" data-act="focoDesmarca">${ic('check',22)} Série feita · toque para desmarcar</button>` : `<button class="fo-feita" data-act="focoFeita">${ic('check',24)} Série feita</button>`}
      ${best && v.kg && v.reps && e1rm(v.kg, v.reps) > best + 0.01 && !v.ok ? `<p class="note" style="text-align:center;color:#9A6500;font-weight:700">Isso vai ser recorde pessoal</p>`:''}`}
    <div class="fo-bot"><button class="fo-nav" data-act="focoEx:${f.i-1}" ${f.i?'':'disabled'}>${ic('esq')} anterior</button>
      <input class="cmt" placeholder="comentário (dor, faltou força…)" data-cmt="${e.id}" value="${esc(notas[e.id]||'')}">
      ${f.i < p.ex.length-1 ? `<button class="fo-nav" data-act="focoEx:${f.i+1}">próximo ${ic('dir')}</button>` : `<button class="fo-nav fim" data-act="encerrar">encerrar</button>`}</div>
  </div>`;
}

/* ---------- PROGRESSO ---------- */
function viewProg(){
  const L = D.pesos[D.pesos.length-1], d7 = D.sessions.filter(s=>s.data>=addDias(hoje(),-6)).length;
  const nomes = [...new Set(D.sessions.flatMap(s=>s.itens.filter(i=>!i.bw).map(i=>i.nome)))].sort();
  const sel = memo.get('exSel') && nomes.includes(memo.get('exSel')) ? memo.get('exSel') : nomes[0];
  const prs = nomes.map(n=>{ let b = {v:0}; D.sessions.forEach(s=>s.itens.filter(i=>i.nome===n).forEach(i=>i.sets.forEach(x=>{ const v = e1rm(x.kg||0,x.reps||0); if (v>b.v) b = {v, kg:x.kg, reps:x.reps, data:s.data}; }))); return {n, ...b}; }).filter(x=>x.v).sort((a,b)=>b.data<a.data?-1:1).slice(0,8);
  const hist = [...D.sessions.map(s=>({k:'s', data:s.data, ts:s.ts||0, s})), ...D.atividades.map(a=>({k:'a', data:a.data, ts:a.ts||0, a}))].sort((a,b)=>a.data===b.data?b.ts-a.ts:(a.data<b.data?1:-1)).slice(0,40);
  return `<div class="grid two"><div class="col">
    <section class="panel"><div class="stats"><div class="stat"><b>${L?f1(L.kg):'—'}</b><small>peso kg</small></div><div class="stat"><b>${D.sessions.length}</b><small>treinos</small></div><div class="stat"><b>${d7}</b><small>em 7 dias</small></div></div></section>
    <section class="panel"><div class="ph"><h2 style="--hc:var(--sky)">Peso corporal</h2>${D.pesos.length>1?`<span class="num note" style="margin:0">${(L.kg-D.pesos[0].kg>0?'+':'')+f1(L.kg-D.pesos[0].kg)} kg</span>`:''}</div>
      <form class="row" id="pesoF"><input class="in" id="pesoIn" inputmode="decimal" placeholder="Peso de hoje, ex.: 78,4"><button class="btn p" style="flex:0 0 auto">Salvar</button></form><svg class="chart" id="chPeso"></svg></section>
    <section class="panel"><div class="ph"><h2 style="--hc:var(--tang)">Evolução de carga</h2></div>
      ${nomes.length?`<select class="in" id="exSel">${nomes.map(n=>`<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('')}</select><svg class="chart" id="chCarga"></svg><p class="note" id="cargaInfo"></p>`:`<p class="note">Encerre um treino e a evolução aparece aqui.</p>`}</section>
    <section class="panel"><div class="ph"><h2 style="--hc:var(--mint)">Volume por treino</h2></div><svg class="chart" id="chVol"></svg><p class="note">Carga × repetições somadas. Subindo com o tempo = progresso.</p></section>
    <section class="panel"><div class="ph"><h2 style="--hc:var(--tang)">Corrida por semana</h2></div><svg class="chart" id="chKm"></svg></section>
  </div><div class="col">
    ${prs.length?`<section class="panel"><div class="ph"><h2 style="--hc:var(--amber)">Recordes</h2></div>${prs.map(p=>`<div class="li"><span class="t">${esc(p.n)}<small>${br(p.data)} · 1RM estimado ${f1(p.v)} kg</small></span><span class="v">${f1(p.kg)}×${p.reps}</span><span></span></div>`).join('')}</section>`:''}

  return h + `</div><p class="note">Azul: musculação · laranja: corrida/futebol.</p>`; }
function cor(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#2D5BFF'; }
function linha(id, pts, un, corV){ const svg = document.getElementById(id); if (!svg) return; const W=620,H=170,P=30; svg.setAttribute('viewBox',`0 0 ${W} ${H}`); const c = cor(corV), mut = cor('--muted'), ln = cor('--line');
  if (pts.length<2){ svg.innerHTML = `<text x="10" y="90" fill="${mut}" font-family="JetBrains Mono" font-size="12">precisa de 2 registros ou mais</text>`; return; }
  const ys = pts.map(p=>p.y), mn = Math.min(...ys), mx = Math.max(...ys), rg = (mx-mn)||1; const X = i=>P+i*(W-P*2)/(pts.length-1), Y = v=>H-P-((v-mn)/rg)*(H-P*2);

function desenharGraficos(){

/* ================= AÇÕES ================= */
async function acao(a, el){
  const [cmd, ...rest] = a.split(':'); const arg = rest.join(':');
  switch(cmd){
    case 'fechar': fecharFolha(); return;
    case 'foco': abrirFoco(Number(arg)); return;
    case 'fecharFoco': fecharFoco(); return;
    case 'focoEx': { const p = getPlan(plano); const i = Number(arg); if (i<0 || i>=p.ex.length) return; abrirFoco(i); return; }
    case 'focoSet': S.foco.s = Number(arg); renderFoco(); return;
    case 'stp': { const [campo, d] = arg.split(':'); const e = getPlan(plano).ex[S.foco.i]; const s = S.foco.s; const v = valorSerie(e, s); log[e.id] ||= []; log[e.id][s] ||= {};
      if (campo==='kg'){ const k = v.kg||0; const passo = k>=40 ? 2.5 : k>=12 ? 2 : 1; log[e.id][s].kg = String(Math.max(0, Math.round((k + Number(d)*passo)*2)/2)); }
      else { log[e.id][s].reps = String(Math.max(0, (v.reps||0) + Number(d))); }
      if (log[e.id][s].kg==null && v.kg!=null) log[e.id][s].kg = String(v.kg); if (log[e.id][s].reps==null && v.reps!=null) log[e.id][s].reps = String(v.reps);
      persist(); renderFoco(); return; }
    case 'focoFeita': { const p = getPlan(plano), e = p.ex[S.foco.i], s = S.foco.s; const kgI = $('#foKg'), rI = $('#foReps'); const v = valorSerie(e, s);
      const kg = kgI ? num(kgI.value) : null, reps = rI ? parseInt(rI.value) : v.reps; if (!e.bw && kgI && kg==null){ toast('Coloque a carga.'); return; }
      log[e.id] ||= []; log[e.id][s] = {kg: e.bw ? undefined : String(kg), reps: reps!=null && !isNaN(reps) ? String(reps) : undefined, ok:true};
      const nome = swaps[e.id]||e.nome, best = melhor1rm(nome, hoje()), val = e1rm(kg||0, reps||0); if (best && val > best + 0.01) toast(`Recorde em ${nome}! 1RM estimado ${f1(val)} kg`);
      persist();
      const prox = (log[e.id]||[]).findIndex((x,k)=>k<nSeries(e) && !(x&&x.ok)); const n = progressoEx(e);
      if (n.n < n.ns){ S.foco.s = prox>=0 ? prox : n.n; startTimer(+e.rest||90); }
      else { const k = p.ex.findIndex(x=>{ const q = progressoEx(x); return q.n < q.ns; });
        if (k>=0){ startTimer(+e.rest||90); S.foco = {i:k, s: progressoEx(p.ex[k]).n}; toast(`Exercício concluído. Próximo: ${swaps[p.ex[k].id]||p.ex[k].nome}`); }
        else toast('Treino completo! Toque em “encerrar” para salvar.', null, 6000); }
      render(); return; }
    case 'focoDesmarca': { const e = getPlan(plano).ex[S.foco.i]; const x = (log[e.id]||[])[S.foco.s]; if (x) x.ok = false; persist(); renderFoco(); toast('Série desmarcada'); return; }
    case 'entrarGoogle': entrarGoogle(); return;
    case 'entrarEmail': abrirFolha(`<h3>Entrar com e-mail</h3><p class="note">Use o mesmo e-mail e senha da Caderneta.</p><form id="loginF"><label class="f">E-mail</label><input class="in" name="email" type="email" autocomplete="email" required><label class="f">Senha</label><input class="in" name="senha" type="password" autocomplete="current-password" required><div class="btns"><button class="btn p">Entrar</button><button type="button" class="btn" data-act="fechar">Cancelar</button></div></form>`); return;
    case 'sair': if (el.dataset.sure!=='1'){ el.dataset.sure='1'; el.textContent='Toque de novo para sair'; return; } await FB.authM.signOut(FB.auth); toast('Você saiu. Os dados ficam neste aparelho até entrar de novo.'); return;
    case 'plano': plano = arg; persist(); render(); return;
    case 'tirarCustom': comDesfazer('Voltou para o treino normal', ()=>{ D.hojeCustom = null; plano = proximo(); log={}; swaps={}; notas={}; D.rascunho=null; }); return;
    case 'ok': { const [id, s] = arg.split(':'); const p = getPlan(plano), e = p.ex.find(x=>x.id===id); log[id] ||= []; log[id][s] ||= {}; const on = !log[id][s].ok; log[id][s].ok = on;
      if (on){ const kg = document.querySelector(`[data-in="${id}:${s}:kg"]`), rp = document.querySelector(`[data-in="${id}:${s}:reps"]`); if (kg && kg.value!=='') log[id][s].kg = kg.value; if (rp && rp.value!=='') log[id][s].reps = rp.value;
        const nome = swaps[id]||e.nome, best = melhor1rm(nome, hoje()), v = e1rm(num(log[id][s].kg)||0, num(log[id][s].reps)||0); if (best && v > best + 0.01) toast(`🏆 Recorde em ${nome}! 1RM estimado ${f1(v)} kg`);
        startTimer(+e.rest||90); }
      persist(); render(); return; }
    case 'usarSug': { const [id, kg] = arg.split(':'); const e = getPlan(plano).ex.find(x=>x.id===id); log[id] ||= []; for (let s=0; s<nSeries(e); s++){ log[id][s] ||= {}; if (!log[id][s].ok) log[id][s].kg = kg; } persist(); render(); return; }
    case 'maisSerie': { const e = getPlan(plano).ex.find(x=>x.id===arg); log[arg] ||= []; if (log[arg].length < nSeries(e)) log[arg].length = nSeries(e); log[arg].push({}); persist(); render(); return; }
    case 'menosSerie': if (log[arg]?.length){ log[arg].pop(); persist(); render(); } return;
    case 'info': exInfo(arg); return;
    case 'exIA': exIA(arg); return;
    case 'swap': abrirSwap(arg); return;
    case 'troca': { const [id, o] = arg.split(':'); const v = decodeURIComponent(o); const e = getPlan(plano).ex.find(x=>x.id===id); if (v===e.nome) delete swaps[id]; else swaps[id] = v; persist(); fecharFolha(); render(); return; }
    case 'encerrar': { if (S.foco){ S.foco = null; document.body.classList.remove('focando'); $('#foco').hidden = true; } const p = getPlan(plano); const itens = p.ex.map(e=>({nome:swaps[e.id]||e.nome, bw:!!e.bw, sets:(log[e.id]||[]).filter(s=>s&&s.ok).map(s=>({kg:e.bw?null:(num(s.kg)), reps:parseInt(s.reps)||null})), nota:(notas[e.id]||'').trim()})).filter(i=>i.sets.length||i.nota);
      if (!itens.some(i=>i.sets.length)){ toast('Marque pelo menos uma série com o ✓ antes de encerrar.'); return; }
      const id = uid(); comDesfazer(`Treino salvo: ${itens.length} exercícios, ${Math.round(sum(itens,i=>sum(i.sets,x=>(x.kg||0)*(x.reps||0))))} kg de volume`, ()=>{ D.sessions.push({id, data:hoje(), plano:p.id, itens, ts:Date.now()}); D.rascunho=null; log={}; swaps={}; notas={}; if (p.id==='Hoje') D.hojeCustom = null; plano = proximo(); });
      setTimeout(()=>revisarSessao(id), 1200); return; }
    case 'limparHoje': comDesfazer('Marcações de hoje limpas', ()=>{ log={}; swaps={}; notas={}; D.rascunho=null; }); return;
    case 'semanaAbre': case 'semanaFecha': lsSet('caderno:semana', JSON.stringify({w:segunda(), aberto: cmd==='semanaAbre'})); render(); return;
    case 'metaEd': memo.set('edMeta', arg); render(); setTimeout(()=>{ const i=$('#metaIn'); i?.focus(); i?.select(); },0); return;
    case 'metaOk': { const v = num($('#metaIn')?.value); memo.delete('edMeta'); if (v!=null && v>=0){ const m = Object.assign({}, metaSemana()); m[arg] = v; D.metaSem = m; if (arg==='prot') D.protAlvo = v; save(); } render(); return; }
    case 'delAtiv': comDesfazer('Atividade apagada', ()=>{ D.atividades = D.atividades.filter(x=>x.id!==arg); }); return;
    case 'delSess': fecharFolha(); comDesfazer('Treino apagado', ()=>{ D.sessions = D.sessions.filter(x=>x.id!==arg); }); return;
    case 'preencher': { const q = $('#q'); q.value = arg; q.focus(); const i = arg.indexOf('  '); if (i>=0) q.setSelectionRange(i+1, i+1); atualizarPreview(); return; }
    case 'perg': perguntarCoach(arg); return;
    case 'limparChat': S.chat = []; lsSet('caderno:chat','[]'); render(); return;
    case 'aplicar': { const [ci, i] = arg.split(':').map(Number); const c = S.chat[ci], ac = c?.acoes?.[i]; if (!ac) return; let msg = null;
      ac._ok = true; msg = comDesfazer(r => r ? r + (ac.tipo==='treino_hoje' ? ' · já está em “Treino de hoje”' : '') : 'Nada mudou', ()=>aplicarAcao(ac)); if (!msg){ ac._ok = false; toast('Não consegui aplicar essa mudança.'); return; } lsSet('caderno:chat', JSON.stringify(S.chat)); render(); if (ac.tipo==='treino_hoje') setTimeout(()=>document.querySelector('.hero')?.scrollIntoView({behavior:'smooth', block:'center'}), 60); return; }
    case 'insights': gerarInsights(true); return;
    case 'relIA': { const box = $('#relIA'); if (box) box.innerHTML = `<span class="il">Comentário do coach</span><div class="load">Analisando…</div>`; await revisarSessao(arg); relatorio(arg); return; }
    case 'cal': { const cm = memo.get('calMes') || hoje().slice(0,7); const d = new Date(cm+'-15T12:00:00'); d.setMonth(d.getMonth()+Number(arg)); memo.set('calMes', iso(d).slice(0,7)); render(); return; }
    case 'rel': relatorio(arg); return;
    case 'dia': { const k = addDias(memo.get('dia')||hoje(), Number(arg)); if (k<=hoje()) memo.set('dia', k); render(); return; }
    case 'irDia': memo.set('dia', arg); render(); return;
    case 'agua': { const d = diaDe(memo.get('dia')||hoje()), n = +arg; d.agua = d.agua===n ? n-1 : n; save(); render(); return; }
    case 'come': { const d = diaDe(memo.get('dia')||hoje()), i = d.comido.indexOf(arg); i>=0 ? d.comido.splice(i,1) : d.comido.push(arg); save(); render(); return; }
    case 'delEat': { const [rid, xid] = arg.split(':'); const d = diaDe(memo.get('dia')||hoje()); comDesfazer('Removido', ()=>{ d.mealEat[rid] = (d.mealEat[rid]||[]).filter(x=>x.id!==xid); }); return; }
    case 'meta': { if (el.closest('[data-act^="delMeta"]')) return; const d = diaDe(memo.get('dia')||hoje()), i = d.feito.indexOf(arg); i>=0 ? d.feito.splice(i,1) : d.feito.push(arg); save(); render(); return; }
    case 'delMeta': comDesfazer('Meta removida', ()=>{ D.metas = D.metas.filter(m=>m.id!==arg); }); return;
    case 'novaRef': { const r = {id:uid(), hora:'', nome:'Nova refeição', itens:[]}; D.refeicoes.push(r); save(); editRef(r.id); return; }
    case 'editRef': editRef(arg); return;
    case 'delRef': fecharFolha(); comDesfazer('Refeição excluída', ()=>{ D.refeicoes = D.refeicoes.filter(x=>x.id!==arg); }); return;
    case 'exportClaude': baixar(`treino-para-o-claude-${hoje()}.md`, textoParaClaude(), 'text/markdown'); toast('Arquivo baixado. Mande ele para o Claude no chat.'); return;
    case 'copiarClaude': try{ await navigator.clipboard.writeText(textoParaClaude()); toast('Copiado. Cole no chat do Claude.'); }catch(e){ toast('Não consegui copiar. Use “Exportar para o Claude”.'); } return;
    case 'colarClaude': colarClaude(); return;
    case 'lerClaude': importarClaude($('#claudeIn')?.value||''); return;
    case 'editP': editP = arg; render(); return;
    case 'novoPlano': { const usados = new Set(D.plans.map(p=>p.id)); let c = 65; while (usados.has(String.fromCharCode(c))) c++; const id = String.fromCharCode(c); comDesfazer(`Treino ${id} criado`, ()=>{ D.plans.push({id, nome:'Novo treino', ex:[]}); editP = id; }); return; }
    case 'delPlano': if (el.dataset.sure!=='1'){ el.dataset.sure='1'; el.textContent='toque de novo para excluir'; return; } comDesfazer(`Treino ${editP} excluído`, ()=>{ D.plans = D.plans.filter(p=>p.id!==editP); editP = D.plans[0].id; if (!D.plans.some(p=>p.id===plano)) plano = proximo(); }); return;
    case 'novoEx': { const p = D.plans.find(x=>x.id===editP); if (!p) return; p.ex.push({id:uid(), nome:'Novo exercício', series:3, reps:'8–12', rest:90, nota:'', alts:[]}); save(); render(); setTimeout(()=>{ const ins = document.querySelectorAll('[data-e$=":nome"]'); const i = ins[ins.length-1]; i?.focus(); i?.select(); },30); return; }
    case 'delEx': { const p = D.plans.find(x=>x.id===editP); comDesfazer('Exercício excluído', ()=>{ p.ex = p.ex.filter(x=>x.id!==arg); }); return; }
    case 'mover': { const [id, d] = arg.split(':'); const p = D.plans.find(x=>x.id===editP); const i = p.ex.findIndex(x=>x.id===id), j = i + Number(d); if (j<0||j>=p.ex.length) return; [p.ex[i], p.ex[j]] = [p.ex[j], p.ex[i]]; save(); render(); return; }
    case 'backup': baixar(`caderno-${hoje()}.json`, JSON.stringify(D,null,1), 'application/json'); return;
    case 'importBackup': { const inp = document.createElement('input'); inp.type='file'; inp.accept='application/json,.json'; inp.onchange = async ()=>{ try{ const n = JSON.parse(await inp.files[0].text()); if (!n.plans) throw 0; comDesfazer('Backup importado', ()=>{ D = n; defaults(); plano = proximo(); log={}; swaps={}; notas={}; D.rascunho=null; }); }catch(e){ toast('Esse arquivo não é um backup do Caderno.'); } }; inp.click(); return; }
    case 'tema': aplicarTema(arg); render(); return;
    case 'timerMais': tL += 30; tick(); return;
    case 'timerPara': stopTimer(false); return;
    case 'iaBarra': iaBarra(); return;
    case 'instalarApp': instalarApp(); return;
    case 'naoInstalar': $('#convApp')?.remove(); lsSet('caderno:instalar','nao'); toast('Combinado, não pergunto mais. Está em Treinos → App no celular.'); return;
    case 'procurarVersao': procurarVersao(true); return;
    case 'atualizarApp': atualizarAgora(); return;
  }
}

let atualP = null;
function atualizarPreview(){ const q = $('#q'), v = q.value; q.style.height='48px'; if (v.includes('\n') || q.scrollHeight>52) q.style.height = Math.min(140, q.scrollHeight)+'px';
  const pv = $('#pv'); if (!v.trim()){ atualP = null; $('#goBtn').disabled = true; pv.innerHTML = `<span class="hint">Escreva do jeito que falaria. Séries, corrida, futebol, peso, água, comida. Várias coisas de uma vez também.</span>`; return; }
  const P = parseTexto(v); atualP = P; $('#goBtn').disabled = false;
  const cor = {peso:'b', agua:'b', sono:'v', atividade:'o', comida:'y', series:'g'};
  pv.innerHTML = P.itens.map(it=>`<span class="pill ${cor[it.tipo]||''}">${esc(descItem(it))}${it.incompleto?' · faltou tempo/km':''}</span>`).join('') + (P.falhas.length ? `<span class="pill r">${P.falhas.length} trecho${P.falhas.length>1?'s':''} sem entender</span><button class="chip" data-act="iaBarra">Ler com IA</button>` : '') + (!P.itens.length ? `<span class="hint">Toque em Lançar e a IA lê.</span>` : '');
}
async function lancarBarra(){ const v = $('#q').value.trim(); if (!v) return; const P = atualP || parseTexto(v);
  if (!P.itens.length || P.falhas.length && !P.itens.length) return iaBarra();
  const itens = P.itens; $('#q').value=''; atualizarPreview();
  comDesfazer(res => res.join(' · ') + (P.falhas.length ? ` · não entendi: “${P.falhas.join('”, “')}”` : ''), ()=>aplicarItens(itens));
}
async function iaBarra(){ const v = $('#q').value.trim(); if (!v) return; const pv = $('#pv'); pv.innerHTML = `<span class="load">A IA está lendo…</span>`;
  const exs = getPlan(plano).ex.map(e=>`${e.id}=${swaps[e.id]||e.nome}`).join('; ');
  try{ const r = await S.ia.json(`Converta o que a pessoa escreveu sobre treino/saúde em itens. Hoje é ${hoje()}. Exercícios do treino de hoje (id=nome): ${exs}.
Texto: "${v}"
Responda só JSON: [{"tipo":"series","exId":"id do exercício","sets":[{"kg":40,"reps":10}]} | {"tipo":"atividade","esporte":"Corrida|Futebol|Caminhada|Bike|Natação|outro","km":null,"min":null,"kcal":null} | {"tipo":"peso","kg":78.4} | {"tipo":"agua","copos":2} | {"tipo":"sono","h":7} | {"tipo":"comida","t":"descrição curta","p":gramas de proteína estimadas}]`);
    const arr = (Array.isArray(r) ? r : (r.itens||[])).map(x=>{ if (x.tipo==='series'){ const e = getPlan(plano).ex.find(e=>e.id===x.exId) || acharExercicio(String(x.exId||'')); return e ? {tipo:'series', ex:e, sets:(x.sets||[]).map(s=>({kg:num(s.kg), reps:parseInt(s.reps)||null}))} : null; } return x; }).filter(x=>x && x.tipo);
    if (!arr.length){ pv.innerHTML = `<span class="pill r">A IA também não entendeu. Tente “supino 40kg 10 10 8”.</span>`; return; }
    $('#q').value=''; atualizarPreview(); comDesfazer(res => res.join(' · '), ()=>aplicarItens(arr));
  }catch(e){ pv.innerHTML = `<span class="pill r">${esc(S.ia.erro(e))}</span>`; } }

  if (f.id==='swapF'){ const v = $('#swapIn').value.trim(); if (!v) return; const id = f.dataset.ex; const e2 = getPlan(plano).ex.find(x=>x.id===id); swaps[id] = v; if (!(e2.alts||[]).includes(v)){ (e2.alts ||= []).push(v); } persist(); fecharFolha(); render(); return; }
  if (f.id==='metaF'){ const v = $('#metaNova').value.trim(); if (!v) return; D.metas.push({id:uid(), t:v, s:''}); save(); render(); return; }
  if (f.id==='refF'){ const r = D.refeicoes.find(x=>x.id===f.dataset.id); const fd = new FormData(f); r.hora = String(fd.get('h')).trim(); r.nome = String(fd.get('n')).trim()||'Refeição'; r.itens = String(fd.get('i')).split('\n').map(s=>s.trim()).filter(Boolean); D.refeicoes.sort((a,b)=>(a.hora||'').localeCompare(b.hora||'')); save(); fecharFolha(); render(); return; }
  if (f.id==='loginF'){ const fd = new FormData(f); const b = f.querySelector('button.p'); b.disabled = true; b.textContent = 'Entrando…'; await entrarEmail(String(fd.get('email')).trim(), String(fd.get('senha'))); b.disabled = false; b.textContent = 'Entrar'; return; }
  if (f.dataset.eatf){ const rid = f.dataset.eatf, t = f.querySelector('[data-et]').value.trim(); let p = parseInt(f.querySelector('[data-ep]').value)||0; if (!t){ toast('Escreva o que comeu.'); return; }
    const k = memo.get('dia')||hoje(); const id = uid(); comDesfazer(`Registrado: ${t}`, ()=>{ (diaDe(k).mealEat[rid] ||= []).push({id, t, p}); });
    if (!p){ try{ const r = await S.ia.json(`Estime os gramas de PROTEÍNA desta refeição brasileira: "${t}". Responda só JSON {"p":número inteiro,"obs":"curta"}`); const g = parseInt(r.p)||0; const x = (diaDe(k).mealEat[rid]||[]).find(y=>y.id===id); if (x && g){ x.p = g; save(); render(); toast(`A IA estimou ${g} g de proteína${r.obs?` (${r.obs})`:''}`); } }catch(err){} }
    return; }
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape'){ if ($('#layer').classList.contains('on')) fecharFolha(); else if (S.foco) fecharFoco(); } const t = e.target; if (e.key==='Enter' && t.id==='metaIn'){ e.preventDefault(); t.closest('.inl')?.querySelector('button')?.click(); } });
$('#q').addEventListener('input', atualizarPreview);
$('#q').addEventListener('keydown', e=>{ if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); lancarBarra(); } });
$('#goBtn').onclick = lancarBarra;
$('#temaBtn').onclick = ()=>{ const t = document.documentElement.dataset.tema; aplicarTema(t==='escuro' ? 'claro' : 'escuro'); render(); };
function aplicarTema(t){ document.documentElement.dataset.tema = t; lsSet('caderno:tema', t); $('#temaBtn').textContent = t==='escuro' ? '☾' : '☀'; }

/* ================= APP NO CELULAR E ATUALIZAÇÃO ================= */
let pedidoInstalar = null;
if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); pedidoInstalar = e;
  if (!lsGet('caderno:instalar') && !matchMedia('(display-mode: standalone)').matches) setTimeout(()=>{ if (!pedidoInstalar || $('#convApp')) return; const d = document.createElement('div'); d.id='convApp'; d.className='conv'; d.innerHTML = `<span><b>Quer o Treino como app?</b> Abre direto da tela inicial.</span><button data-act="instalarApp">Instalar</button><button class="x" data-act="naoInstalar">Agora não</button>`; document.body.appendChild(d); }, 4000); });
addEventListener('appinstalled', ()=>{ lsSet('caderno:instalar','feito'); $('#convApp')?.remove(); toast('Pronto: o Treino está na sua tela inicial.'); });
async function instalarApp(){ $('#convApp')?.remove(); if (pedidoInstalar){ pedidoInstalar.prompt(); const r = await pedidoInstalar.userChoice.catch(()=>({})); lsSet('caderno:instalar', r.outcome==='accepted'?'feito':'nao'); pedidoInstalar = null; }
  else toast(/iphone|ipad/i.test(navigator.userAgent) ? 'No Safari: Compartilhar → Adicionar à Tela de Início.' : 'No Chrome: menu ⋮ → Instalar app (ou Adicionar à tela inicial).', null, 8000); }
const abertoEm = Date.now(); let avisouVersao = false;
async function procurarVersao(manual){ if (!/github\.io$/.test(location.hostname)){ if (manual) toast('A atualização automática funciona no site.'); return; }
  try{ const r = await fetch('version.json?t='+Date.now(), {cache:'no-store'}); const j = await r.json();
    if (!j.v || j.v===VERSAO){ if (manual) toast(`Você já está na versão mais nova (${VERSAO}).`); return; }
    let tentou = null; try{ tentou = sessionStorage.getItem('caderno:tentou'); }catch(e){}
    const mexendo = $('#layer.on') || (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.value);
    if (manual || (Date.now()-abertoEm < 8000 && !mexendo && tentou!==j.v)){ try{ sessionStorage.setItem('caderno:tentou', j.v); }catch(e){} return atualizarAgora(); }
    if (avisouVersao) return; avisouVersao = true; const d = document.createElement('div'); d.className='conv'; d.id='novaVersao'; d.innerHTML = `<span><b>Versão nova do Treino.</b></span><button data-act="atualizarApp">Atualizar agora</button>`; document.body.appendChild(d);
  }catch(e){ if (manual) toast('Sem conexão para procurar atualização.'); } }
async function atualizarAgora(){ try{ const regs = await navigator.serviceWorker?.getRegistrations?.() || []; for (const r of regs) await r.update().catch(()=>{}); const ks = await caches?.keys?.() || []; for (const k of ks) await caches.delete(k); }catch(e){} location.replace(location.pathname + '?v=' + Date.now()); }
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') procurarVersao(false); });

/* ================= INÍCIO ================= */
(async()=>{
  aplicarTema(lsGet('caderno:tema') || 'claro');
  $('#view').innerHTML = `<div class="panel"><div class="load">Abrindo seu caderno…</div></div>`;
  await load(); plano = (D.rascunho && D.rascunho.data===hoje() && D.rascunho.plano) || (D.hojeCustom && D.hojeCustom.data===hoje() ? 'Hoje' : proximo());
  render(); setTimeout(()=>procurarVersao(false), 1500);
  setTimeout(()=>gerarInsights(false), 2500);
})();
</script>
