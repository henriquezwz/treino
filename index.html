<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<title>Caderno de Treino</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --sunk:#E9EDF6; --ink:#141B34; --muted:#5E6784; --line:#DCE1EE;
  --blue:#2D5BFF; --blue-deep:#1A3FD6; --blue-soft:#E2E9FF;
  --tang:#FF6A2B; --tang-soft:#FFE7DC;
  --violet:#7B5CF5; --violet-soft:#ECE6FF;
  --amber:#F2A007; --amber-soft:#FFF1D2;
  --mint:#12B07F; --mint-soft:#D8F4E9;
  --sky:#119FE3; --sky-soft:#DDF2FC; --pink:#E9468A; --teal:#0E9E9B;
  --danger:#E0363B; --danger-soft:#FDE3E3;
  --f-ui:"Schibsted Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px; --shadow:0 1px 2px rgba(20,27,52,.05),0 10px 30px -18px rgba(20,27,52,.22);
}
:root[data-tema="escuro"]{
  --bg:#0B1020; --surface:#131A2E; --sunk:#1B2339; --ink:#E8ECF7; --muted:#97A0BC; --line:#252F4A;
  --blue:#5C82FF; --blue-deep:#3F66F0; --blue-soft:#1C2A55; --tang:#FF7E45; --tang-soft:#3A2218;
  --violet:#9A82FF; --violet-soft:#2A2350; --amber:#FFB534; --amber-soft:#3A2D10;
  --mint:#2FCB97; --mint-soft:#103629; --sky:#3DB5F0; --sky-soft:#0F2C3D; --pink:#F2679F;
  --danger:#FF5A5E; --danger-soft:#3D1A1D; --shadow:none; color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root[data-tema="auto"]{
  --bg:#0B1020; --surface:#131A2E; --sunk:#1B2339; --ink:#E8ECF7; --muted:#97A0BC; --line:#252F4A;
  --blue:#5C82FF; --blue-deep:#3F66F0; --blue-soft:#1C2A55; --tang:#FF7E45; --tang-soft:#3A2218;
  --violet:#9A82FF; --violet-soft:#2A2350; --amber:#FFB534; --amber-soft:#3A2D10;
  --mint:#2FCB97; --mint-soft:#103629; --sky:#3DB5F0; --sky-soft:#0F2C3D; --pink:#F2679F;
  --danger:#FF5A5E; --danger-soft:#3D1A1D; --shadow:none; color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none!important}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:12px 16px 0}

/* topo */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand i{width:18px;height:18px;border-radius:5px;background:var(--tang);box-shadow:7px 0 0 -2px var(--blue);display:inline-block}
.sync{font:600 12px var(--f-num);color:var(--muted);display:flex;align-items:center;gap:5px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--mint)}.sync.sv .dot{background:var(--amber)}.sync.er .dot{background:var(--danger)}
.top .sp{flex:1}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px}

/* barra de lançar */
.barra{display:flex;gap:8px}
.barra textarea{flex:1;min-width:0;height:48px;max-height:140px;resize:none;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;font-size:16px;line-height:1.35;box-shadow:var(--shadow)}
.barra textarea:focus{outline:0;border-color:var(--blue)}
.barra .go{border-radius:14px;padding:0 18px;background:var(--blue);color:#fff;font-weight:700;min-width:84px}
.barra .go:disabled{background:var(--sunk);color:var(--muted)}
.pv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px;margin:8px 0 12px;font-size:13px}
.pv .hint{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;background:var(--sunk);font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.b{background:var(--blue-soft);color:var(--blue)}.pill.o{background:var(--tang-soft);color:var(--tang)}.pill.g{background:var(--mint-soft);color:var(--mint)}
.pill.y{background:var(--amber-soft);color:#9A6500}.pill.v{background:var(--violet-soft);color:var(--violet)}.pill.r{background:var(--danger-soft);color:var(--danger)}
:root[data-tema="escuro"] .pill.y{color:var(--amber)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}

/* grade */
.grid{display:grid;gap:14px}
@media (min-width:900px){.grid.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.col{display:grid;gap:14px;align-content:start;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ph h2{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.ph h2:before{content:"";width:9px;height:9px;border-radius:3px;background:var(--hc,var(--blue))}
.act{color:var(--blue);font-weight:700;font-size:13px}
.note{color:var(--muted);font-size:13px;margin:6px 0 0}
.lnk{color:var(--blue);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.lnk.r{color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.o{background:var(--tang);border-color:var(--tang);color:#fff}.btn.g{background:var(--mint);border-color:var(--mint);color:#fff}
.btn.w{width:100%}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:15px}
input.in:focus,select.in:focus,textarea.in:focus{outline:0;border-color:var(--blue)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}

/* plano da semana */
.plano{background:linear-gradient(180deg,var(--tang-soft),var(--surface) 70%);border-color:color-mix(in srgb,var(--tang) 25%,var(--line))}
.plano-min{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left}
.plano-min small{display:block;color:var(--muted);font-size:12.5px}
.pl-l{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pl-l:first-of-type{border-top:0}
.pl-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--cc-soft,var(--sunk));color:var(--cc,var(--ink));font-size:14px}
.pl-n{font-weight:600}.pl-n small{color:var(--muted);font-weight:500;font-size:12px;margin-left:4px}
.pl-v{font-size:13px;color:var(--muted);white-space:nowrap}.pl-v b{color:var(--ink)}
.pl-v button{color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px}
.pl-bar{grid-column:2/4;height:6px;border-radius:6px;background:var(--sunk);overflow:hidden;position:relative}
.pl-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--cc,var(--blue))}
.pl-bar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.35}
.inl{display:inline-flex;gap:4px;align-items:center}.inl input{width:70px;padding:5px 8px;border:1.5px solid var(--blue);border-radius:8px;background:var(--surface);font:600 14px var(--f-num)}
.inl button{border-radius:8px;background:var(--blue);color:#fff;font-weight:700;padding:5px 9px;font-size:13px}

/* hero do treino */

.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tang)}
.chips{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.pchip{flex:1;min-width:64px;border:1.5px solid var(--line);border-radius:14px;padding:9px 6px;text-align:center;background:var(--surface);position:relative}
.pchip b{display:block;font-size:18px;font-weight:800}.pchip small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}.pchip[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.pchip.feito:after{content:"✓";position:absolute;top:4px;right:7px;font-size:11px;color:var(--mint);font-weight:800}
.pchip[aria-pressed="true"].feito:after{color:#fff}

/* exercícios */
.ex{border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden;background:var(--surface);position:relative}
.ex:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.ex.parcial:before{background:var(--amber)}.ex.done:before{background:var(--mint)}
.ex-h{display:flex;gap:10px;align-items:flex-start;padding:12px 12px 6px 16px}
.ex-n{font:600 12px var(--f-num);color:var(--tang);padding-top:3px}
.ex-t{flex:1;min-width:0}.ex-t b{font-size:15.5px;line-height:1.25;display:block}
.ex-t b button{text-align:left;text-decoration:underline dotted var(--line);text-underline-offset:4px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{font:500 11px var(--f-num);color:var(--muted);background:var(--sunk);border-radius:999px;padding:2px 8px}
.tag.hot{background:var(--tang-soft);color:var(--tang)}.tag.ok{background:var(--mint-soft);color:var(--mint)}.tag.pr{background:var(--amber-soft);color:#9A6500;font-weight:700}
.ex-note{font-size:12.5px;color:var(--muted);margin-top:5px}
.ex-acts{display:flex;gap:6px}
.icb{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px;text-decoration:none;background:var(--surface)}
.last{font:12px var(--f-num);color:var(--muted);padding:0 12px 6px 40px}.last b{color:var(--blue);font-weight:500}
.sug{font-size:12.5px;color:var(--mint);padding:0 12px 6px 40px;font-weight:600}
.sets{padding:2px 12px 10px 40px;display:grid;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:6px;align-items:center}.set.bw{grid-template-columns:22px 1fr 44px}
.set .lb{font:12px var(--f-num);color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;text-align:center;padding:9px 4px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font:500 15px var(--f-num)}
.set input:focus{outline:0;border-color:var(--blue)}
.tick{height:40px;border-radius:10px;border:1.5px solid var(--line);color:var(--line);font-weight:800;font-size:16px;background:var(--surface)}
.tick.on{background:var(--mint);border-color:var(--mint);color:#fff}
.ex-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 12px 12px 40px}
.mini{font-size:12px;font-weight:700;color:var(--blue);border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)}
.cmt{flex:1;min-width:140px;font-size:13px;padding:7px 10px;border:1px dashed var(--line);border-radius:8px;background:transparent}

/* listas */
.li{display:grid;grid-template-columns:minmax(0,1fr) auto 30px;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:600;min-width:0}.li .t small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.li .v{font:600 14px var(--f-num);text-align:right}
.li .x{width:28px;height:28px;border-radius:8px;color:var(--muted)}.li .x:hover{background:var(--danger-soft);color:var(--danger)}
.li.btnli{cursor:pointer}
.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:8px;background:var(--blue-soft);color:var(--blue);font-weight:800;font-size:12px;margin-right:8px;padding:0 6px}
.badge.c{background:var(--tang-soft);color:var(--tang)}

/* stats e gráficos */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:700 20px var(--f-num)}.stat small{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
svg.chart{width:100%;height:170px;display:block;margin-top:6px;overflow:visible}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal span{text-align:center;font:600 10.5px var(--f-num);color:var(--muted)}
.cal button{aspect-ratio:1;border-radius:9px;background:var(--sunk);font:500 12px var(--f-num);color:var(--muted);position:relative}
.cal button.has{background:var(--blue-soft);color:var(--blue);font-weight:700}
.cal button.cardio{background:var(--tang-soft);color:var(--tang);font-weight:700}
.cal button.has.cardio{background:linear-gradient(135deg,var(--blue-soft) 50%,var(--tang-soft) 50%)}
.cal button.hoje{outline:2px solid var(--blue);outline-offset:-2px}
.cal button.vz{visibility:hidden}

/* comida */
.check{display:grid}
.ck{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.ck:last-child{border-bottom:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.ck.on .box{background:var(--mint);border-color:var(--mint)}.ck.on .ckt{color:var(--muted);text-decoration:line-through}
.ckt small{display:block;color:var(--muted);font-size:12px;text-decoration:none}
.agua{display:flex;gap:6px}.agua button{flex:1;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface)}
.agua button.on{background:linear-gradient(180deg,#7BC8F5,var(--sky));border-color:var(--sky)}
.bar{height:7px;border-radius:7px;background:var(--sunk);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:7px;background:var(--cc,var(--blue))}
.meal{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.meal-h{display:flex;align-items:center;gap:8px}.meal-h b{flex:1}
.hh{font:600 12px var(--f-num);color:var(--tang);background:var(--tang-soft);border-radius:999px;padding:2px 8px}
.fi{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;text-align:left;width:100%}
.fi .box{width:22px;height:22px;border-radius:7px}.fi.on .box{background:var(--mint);border-color:var(--mint)}.fi.on .ft{color:var(--muted);text-decoration:line-through}
.fp{font:600 12px var(--f-num);color:var(--tang)}
.daybar{display:flex;align-items:center;gap:10px;margin-bottom:12px}.daybar div{flex:1;text-align:center}.daybar b{display:block;text-transform:capitalize}.daybar small{color:var(--muted);font-size:12px}
.streak{display:flex;gap:3px}.streak button{flex:1;height:28px;border-radius:6px;background:var(--sunk)}

/* IA */
.ins{display:grid;gap:8px}
.ins-i{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:12px;background:var(--violet-soft)}
.ins-i.alerta{background:var(--danger-soft)}.ins-i.elogio{background:var(--mint-soft)}.ins-i.projecao{background:var(--blue-soft)}
.ins-ic{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--surface);font-weight:800}
.ins-i p{margin:3px 0 0;font-size:13.5px}.ins-i small{display:block;margin-top:4px;font-weight:600}
.ask{display:flex;gap:8px;margin-top:10px}.ask input{flex:1;min-width:0}
.resp{white-space:pre-wrap;font-size:14px;margin-top:10px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.resp:empty{display:none}
.load{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.load:before{content:"";width:16px;height:16px;border-radius:50%;border:2.5px solid var(--violet-soft);border-top-color:var(--violet);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.iabox{border:1.5px dashed var(--violet);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;white-space:pre-wrap}
.iabox b{color:var(--violet)}

/* folha (sheet) */
#layer{position:fixed;inset:0;z-index:62;display:none}
#layer.on{display:block}
#layer .bk{position:absolute;inset:0;background:rgba(10,15,30,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media (min-width:700px){.sheet{bottom:auto;top:6vh;border-radius:20px;max-height:88vh}}
.sheet h3{margin:0 0 4px;font-size:18px}
.box-i{background:var(--sunk);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
.box-i .il{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:3px}
.box-i.err .il{color:var(--danger)}.box-i.ia{background:var(--violet-soft)}.box-i.ia .il{color:var(--violet)}
.opt{display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;margin-top:6px;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}

/* timer, toast, convites */
#timer{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto;z-index:50;background:var(--tang);color:#fff;border-radius:16px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;box-shadow:0 12px 30px -10px rgba(255,106,43,.6)}
#timer.on{display:flex}#timer b{font:700 26px var(--f-num)}#timer small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
#timer button{background:rgba(0,0,0,.18);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:12px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
#toast.on{display:flex}#toast span{flex:1}#toast button{color:var(--tang);font-weight:800;white-space:nowrap}
.conv{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:65;max-width:520px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--tang);border-radius:14px;padding:12px 14px;box-shadow:0 12px 30px -12px rgba(20,27,52,.35)}
.conv span{flex:1 1 200px}.conv button{border-radius:10px;padding:8px 14px;font-weight:700;background:var(--tang);color:#fff}.conv button.x{background:none;color:var(--muted)}

/* abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs div{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:11.5px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--tang);background:var(--tang-soft)}

/* ===== topo no padrão da Caderneta ===== */
.hero{background:var(--surface);border-radius:20px;padding:20px 18px 16px;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(20,27,52,.05),0 10px 30px -16px rgba(20,27,52,.18)}
:root[data-tema="escuro"] .hero{border:1px solid var(--line)}
.confete{position:absolute;right:16px;top:16px;display:flex}
.confete i{width:22px;height:22px;border-radius:50%;margin-left:-7px;border:3px solid var(--surface)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{display:flex;align-items:baseline;gap:10px;margin:8px 0 6px;font-weight:800;letter-spacing:-.035em;line-height:1}
.big>span:first-child{font-size:clamp(52px,14vw,72px)}
.big .de{font-size:18px;letter-spacing:0;font-weight:700;color:var(--tang)}
.big .de button{color:var(--tang);text-decoration:underline dotted;text-underline-offset:4px;font-weight:800}
.hero .sub{color:var(--muted);margin:0;font-size:14.5px}.hero .sub b{color:var(--ink)}
.split{display:flex;height:12px;border-radius:999px;overflow:hidden;margin:16px 0 8px;gap:3px}
.split span{flex:1;border-radius:999px;background:var(--blue)}.split span.vz{background:var(--sunk)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:50%}
.dias7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.dias7>div{display:grid;justify-items:center;gap:4px}.dias7 small{font-size:11px;font-weight:700;color:var(--muted)}
.dias7 span{width:100%;max-width:38px;aspect-ratio:1;border-radius:11px;border:1.5px solid var(--line);display:grid;place-items:center;font:800 13px var(--f-num)}
.dias7 .hoje span{border-color:var(--tang);border-width:2px}.dias7 .hoje small{color:var(--tang)}.dias7 .fut span{border-style:dashed}
.dias7 em{display:flex;gap:3px;height:6px}.dias7 em i{width:6px;height:6px;border-radius:50%}.dias7 em i.r{background:var(--tang)}.dias7 em i.f{background:var(--mint)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 0}
.kpis div{border-radius:12px;padding:10px 10px 9px;min-width:0}
.kpis dt{font-size:12px;color:var(--muted);font-weight:600}.kpis dd{margin:3px 0 0;font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis small{display:block;font-size:11.5px;color:var(--muted)}
.kpis div:nth-child(1){background:var(--amber-soft)}.kpis div:nth-child(1) dd{color:color-mix(in srgb,var(--amber) 75%,var(--ink))}
.kpis div:nth-child(2){background:var(--tang-soft)}.kpis div:nth-child(2) dd{color:var(--tang)}
.kpis div:nth-child(3){background:var(--mint-soft)}.kpis div:nth-child(3) dd{color:var(--mint)}
/* ===== cartão do treino de hoje ===== */
.panel.treino{padding:16px}
.tr-head{display:flex;gap:12px;align-items:center;justify-content:space-between}
.tr-head h3{margin:0 0 3px;font-size:21px;line-height:1.15;letter-spacing:-.015em}
.tr-meta{font-size:13px;color:var(--muted)}
.tr-ring{--p:0;--cc:var(--blue);flex:0 0 58px;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--cc) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;position:relative}
.tr-ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}.tr-ring b{position:relative;font:700 13px var(--f-num)}
.tr-msg{margin-top:10px;background:var(--violet-soft);border-radius:12px;padding:8px 10px;font-size:13.5px}
.tr-msg button{color:var(--violet);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.tr-seg{display:flex;gap:8px;margin:14px 0 4px}
.tr-seg button{flex:1;min-width:0;border-radius:14px;padding:9px 10px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.tr-seg button b{display:block;font-size:18px;font-weight:800;color:var(--cc)}
.tr-seg button small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-seg button[aria-selected="true"]{background:var(--cc);border-color:var(--cc)}.tr-seg button[aria-selected="true"] b,.tr-seg button[aria-selected="true"] small{color:#fff}
.tr-seg button.feito b:after{content:" ✓";font-size:13px}
.tr-lista{padding:4px 0}
.tr-ex{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 6px;border-bottom:1px solid var(--line)}
.tr-ex:last-child{border-bottom:0}
.tr-n{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--sunk);font:700 14px var(--f-num);color:var(--muted)}
.tr-ex.meio .tr-n{background:var(--amber-soft);color:#9A6500}.tr-ex.feito .tr-n{background:var(--mint);color:#fff}
.tr-t{min-width:0}.tr-t b{display:block;font-size:15.5px;line-height:1.25}.tr-ex.feito .tr-t b{color:var(--muted)}
.tr-t small{display:block;font:500 12.5px var(--f-num);color:var(--muted);margin-top:2px}
.tr-t em{font-style:normal;font-family:var(--f-ui);font-weight:700;color:var(--mint);background:var(--mint-soft);border-radius:999px;padding:1px 7px;margin-left:4px}
.tr-t em.volta{color:var(--violet);background:var(--violet-soft)}
.tr-dots{display:flex;gap:4px}.tr-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.tr-dots i.on{background:var(--mint)}
.tr-acoes{display:grid;gap:8px;justify-items:center;padding-top:6px}
.btn.big{padding:15px 16px;font-size:16px;border-radius:14px}
.panel.conta{border-left:5px solid var(--blue)}.panel.aviso{border-left:5px solid var(--danger)}

/* ===== modo academia (compacto) ===== */
body.focando{overflow:hidden}
#foco{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto}
.fo{max-width:520px;margin:0 auto;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));min-height:100%;display:flex;flex-direction:column;gap:10px}
.fo-top{display:flex;align-items:center;gap:10px}
.fo-ib{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:0 0 auto}
.fo-pos{flex:1;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.fo-pos button{width:18px;height:5px;border-radius:5px;background:var(--line)}
.fo-pos button.meio{background:var(--amber)}.fo-pos button.ok{background:var(--mint)}.fo-pos button.cur{background:var(--tang);width:26px}
.fo-ex h2{margin:0;font-size:20px;line-height:1.2;letter-spacing:-.01em}.fo-ex h2 button{text-align:left}
.fo-alvo{color:var(--muted);font-size:13px;margin-top:2px}.fo-alvo b{color:var(--tang)}
.fo-sets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.fo-set{flex:0 0 auto;min-width:58px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:4px 8px;text-align:center;line-height:1.2}
.fo-set small{display:block;font-size:10px;color:var(--muted);font-weight:700}.fo-set b{font:700 13px var(--f-num)}
.fo-set.ok{background:var(--mint-soft);border-color:var(--mint)}.fo-set.ok b{color:var(--mint)}
.fo-set.cur{border-color:var(--tang);box-shadow:0 0 0 3px var(--tang-soft)}
.fo-set.add{min-width:38px;display:grid;place-items:center;color:var(--tang)}
.rel{position:fixed;left:0;right:0;top:0;z-index:58;width:100%;height:calc(40px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:0;border-bottom:1px solid var(--line);color:var(--tang);text-align:left;font:inherit;cursor:pointer}
.rel[hidden]{display:none}
.rel b{font:700 16px var(--f-num);letter-spacing:-.02em;min-width:52px}
.rel small{flex:1;min-width:0;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mint)}
.rel i{position:absolute;left:0;bottom:-1px;height:3px;width:calc(var(--rp,0) * 1%);background:currentColor;border-radius:0 3px 3px 0;transition:width 1s linear}
.rel.atras,.rel.atras small,.rel.parado,.rel.parado small{color:#B87800}
:root[data-tema="escuro"] .rel.atras,:root[data-tema="escuro"] .rel.atras small,:root[data-tema="escuro"] .rel.parado,:root[data-tema="escuro"] .rel.parado small{color:var(--amber)}
.rel.parado{background:var(--amber-soft);animation:relPulsa 1.6s ease-in-out infinite}
@keyframes relPulsa{50%{background:var(--surface)}}
.rel.over{background:var(--danger-soft)}.rel.over,.rel.over small{color:var(--danger)}
body.cronando{padding-top:calc(40px + env(safe-area-inset-top,0px))}
body.cronando #foco{top:calc(40px + env(safe-area-inset-top,0px))}
.rel-meta{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px}.rel-meta b{font-size:34px;font-weight:800;color:var(--tang)}
.chip.on{background:var(--tang);border-color:var(--tang);color:#fff}
textarea.grow{resize:none;overflow:hidden;font:inherit;line-height:1.35;min-height:42px;display:block}
.ask,.exc-f{align-items:flex-end}
.tr-pul{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:8px}.tr-pul .chip{font-size:12.5px;padding:5px 10px;text-decoration:line-through;text-decoration-color:var(--muted)}
.eq{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;display:grid;gap:5px;background:var(--surface)}
.eq.on{border-color:var(--mint);background:var(--mint-soft)}
.eq-h{display:flex;align-items:center;gap:8px;justify-content:space-between}.eq-h b{font-size:15px}
.eq-m{font-size:12.5px;color:var(--muted);font-weight:600}
.eq-d{font-size:13.5px;line-height:1.4}.eq-d .il{display:inline;margin-right:6px}
.eq-c{font-size:12.5px;color:var(--violet);font-weight:600}
.eq-b{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.tr-comb{display:flex;flex-direction:column;gap:6px;margin:10px 0 2px}
.comb{display:flex;align-items:center;gap:8px;background:var(--violet-soft);color:var(--ink);border-radius:12px;padding:6px 6px 6px 12px;font-size:13px;font-weight:600}
.comb>span{flex:1;min-width:0}.comb small{color:var(--muted);font-weight:600}.comb.pausa{background:var(--mint-soft)}
.comb button{width:32px;height:32px;border-radius:9px;color:var(--muted);flex:0 0 auto}
.boas{border:1.5px solid var(--tang);background:linear-gradient(180deg,var(--tang-soft),var(--surface) 70%)}
.boas-op{display:grid;gap:8px;margin-top:12px}
.boas-b{display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px}
.boas-b b{display:flex;align-items:center;gap:8px;font-size:15.5px;color:var(--ink)}.boas-b b svg{color:var(--tang)}.boas-b small{color:var(--muted);font-size:13px;font-weight:500}
.mt-abas{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px;margin:8px 0 6px}
.mt-abas button{flex:1;border-radius:9px;padding:8px 6px;font-size:12.5px;font-weight:700;color:var(--muted);min-height:40px}
.mt-abas button[aria-pressed="true"]{background:var(--surface);color:var(--tang);box-shadow:0 1px 3px rgba(20,27,52,.12)}
.mt-c{margin:6px 0 2px}.mt-busy{padding:24px 0}
.mt-ex{margin:4px 0 0;padding-left:20px;font-size:13.5px;display:grid;gap:2px}.mt-ex .num{color:var(--blue);font-size:12.5px}.mt-ex small{color:var(--muted)}
.boas-app{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;min-height:44px;border-radius:12px;border:1.5px dashed var(--tang);color:var(--tang);font-weight:700;font-size:14px;background:transparent}
.panel.inst{border:1.5px solid var(--blue);background:linear-gradient(180deg,var(--blue-soft),var(--surface) 80%)}
.fo-set.del{min-width:38px;display:grid;place-items:center;color:var(--danger);border-style:dashed}
.fo-alvo .lnk{font-size:13px}.fo-prox{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exc{background:var(--surface);border:1.5px solid var(--violet-soft);border-radius:14px;padding:10px 12px;display:grid;gap:8px}
.exc-h{display:flex;align-items:center;gap:8px}.exc-h b{color:var(--violet);font-size:14px}.exc-h small{color:var(--muted);font-size:12px;flex:1}
.fo-ib.sm{width:30px;height:30px;border-radius:9px}
.exc-q{justify-self:end;background:var(--blue-soft);border-radius:12px 12px 4px 12px;padding:6px 10px;font-size:13px;max-width:88%}
.exc-a b.cl,.resp b.cl{color:var(--blue)}.exc-a b.cl.v,.resp b.cl.v{color:var(--tang)}
.exc-a{font-size:13.5px;line-height:1.45;white-space:pre-wrap}
.exc-card{border:1.5px solid var(--tang);background:var(--tang-soft);border-radius:12px;padding:8px 10px;display:grid;gap:4px;font-size:13px}
.exc-ch{font:700 12.5px var(--f-num);color:var(--ink)}
.exc-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.exc-chips .chip{flex:0 0 auto;font-size:12.5px;padding:6px 10px;min-height:34px}
.exc-f{display:flex;gap:6px}.exc-f .in{flex:1;min-width:0;padding:9px 10px;font-size:15px}.exc-f .btn{flex:0 0 auto;min-width:42px;display:grid;place-items:center}
.fo-nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fo-num label{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;text-align:center}
.stp{display:grid;grid-template-columns:38px minmax(0,1fr) 38px;gap:5px;align-items:center}
.stp button{height:46px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.stp button:active{background:var(--tang-soft)}
.stp input{width:100%;min-width:0;height:52px;text-align:center;border:0;border-radius:12px;background:var(--surface);font:700 26px var(--f-num);box-shadow:inset 0 0 0 1.5px var(--line)}
.stp input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--tang)}
.fo-nums:has(.fo-num:only-child){grid-template-columns:1fr}
.fo-feita{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;background:var(--tang);color:#fff;font-size:16.5px;font-weight:800;box-shadow:0 10px 24px -14px rgba(255,106,43,.9)}
.fo-feita.des{background:var(--mint-soft);color:var(--mint);box-shadow:none;font-size:14px}
.fo-desc{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.fo-desc b{display:block;font-size:44px;font-weight:700;color:var(--tang);line-height:1.1;margin:2px 0 4px}
.fo-desc .btns{margin-top:4px}
.fo-bot{margin-top:auto;display:flex;gap:6px;align-items:center}
.fo-nav{display:inline-flex;align-items:center;gap:3px;border-radius:11px;padding:8px 10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;white-space:nowrap}
.fo-nav:disabled{opacity:.4}.fo-nav.fim{background:var(--mint);border-color:var(--mint);color:#fff}
.fo-bot .cmt{min-width:0;flex:1;font-size:12.5px;padding:7px 9px}
body.focando #timer{display:none!important}

/* ===== semana ===== */
.panel.semana{padding:14px 16px}
.sm-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sm-eye{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--tang)}
.sm-big{display:flex;align-items:baseline;gap:6px;margin-top:2px}.sm-big b{font-size:34px;line-height:1;letter-spacing:-.03em}
.sm-big span{color:var(--muted);font-weight:600}.sm-big button{color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px;font-weight:700}
.sm-ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;position:relative;flex:0 0 58px}
.sm-ring:before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.sm-ring span,.sm-ring small{position:relative}.sm-ring span{font:800 18px var(--f-num);color:var(--blue);line-height:1;margin-top:6px}.sm-ring small{font-size:9.5px;color:var(--muted);font-weight:700;margin-top:-14px}
.sm-dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.sm-d{display:grid;justify-items:center;gap:5px}.sm-d small{font-size:11px;font-weight:700;color:var(--muted)}
.sm-c{width:100%;max-width:40px;aspect-ratio:1;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font:800 13px var(--f-num);color:#fff}
.sm-c.m{background:var(--blue)}.sm-d.hoje .sm-c{box-shadow:0 0 0 2px var(--tang)}.sm-d.hoje small{color:var(--tang)}.sm-d.fut .sm-c{background:transparent;border:1.5px dashed var(--line)}
.sm-x{display:flex;gap:3px;height:6px}.sm-x i{width:6px;height:6px;border-radius:50%}.sm-x i.r{background:var(--tang)}.sm-x i.f{background:var(--mint)}
.sm-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.sm-chips span{display:inline-flex;align-items:center;gap:5px;background:var(--sunk);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.panel.novo{border:1.5px solid var(--violet);background:linear-gradient(180deg,var(--violet-soft),var(--surface) 75%)}
.claude-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}.claude-row span{flex:1 1 100%}
/* ===== evolução no modo academia ===== */
.evo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:6px}
.evo-v{font-weight:700;font-size:13.5px;line-height:1.35;border-left:3px solid currentColor;padding-left:8px}
.evo-v.up{color:var(--mint)}.evo-v.trava{color:#9A6500}.evo-v.down{color:var(--danger)}.evo-v.volta,.evo-v.novo,.evo-v.ok{color:var(--violet)}.evo-v.coach{color:var(--tang)}
:root[data-tema="escuro"] .evo-v.trava{color:var(--amber)}
.evo-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.spark{width:100%;height:40px;display:block}
.evo-s{display:grid;gap:1px;text-align:right;font-size:12px;color:var(--muted)}.evo-s b{font:700 13px var(--f-num);color:var(--ink)}

const comPrazo = (p, ms) => Promise.race([p, new Promise((_,r)=>setTimeout(()=>r(new Error('tempo')), ms))]);
async function carregarFirebase(){
  if (FB.app) return FB;
  const [appM, authM, fsM] = await Promise.all([import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-app.js`), import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-auth.js`), import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-firestore.js`)]);

  Object.assign(FB, {appM, authM, fsM, app});
  FB.auth = authM.initializeAuth(app, {persistence: authM.browserLocalPersistence, popupRedirectResolver: authM.browserPopupRedirectResolver});
  FB.db = fsM.getFirestore(app);
  return FB;
}

let pushT = null, ultimoEnvio = 0;
function enviarNuvem(){ clearTimeout(pushT); pushT = null; if (!nuvemRef) return; ultimoEnvio = D._u; const u = D._u;
  FB.fsM.setDoc(nuvemRef, {payload: JSON.stringify(D), _u: D._u || Date.now()}).then(()=>{ if (D._u===u) setSync('ok'); }).catch(()=>setSync('err')); }
function cloudPush(){ if (!nuvemRef) return; setSync(navigator.onLine===false ? 'err' : 'sync'); clearTimeout(pushT); pushT = setTimeout(enviarNuvem, 700); }
/* app indo para o fundo, tela apagando, aba fechando: grava tudo já */
function gravarJa(){ try{ if (D) lsSet(KEY, JSON.stringify(D)); }catch(e){} if (pushT) enviarNuvem(); }
addEventListener('pagehide', gravarJa); document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='hidden') gravarJa(); });
addEventListener('online', ()=>{ if (nuvemRef && D) cloudPush(); }); addEventListener('offline', ()=>{ if (nuvemRef) setSync('err'); });

let D=null, plano='A', log={}, swaps={}, notas={}, ajustes={}, relogio=null, editP='A';
function defaults(){

/* caderno em branco para uma pessoa nova: modelo genérico, nada de treino de outra pessoa */

const PERFIL_LEGADO = 'Faz musculação A/B/C em rodízio, nunca dois dias de perna. Objetivo: estética, força e pernas recuperadas. Corre de vez em quando e joga futebol; já teve canelite. Quer treinar em no máximo 1 hora. Prefere mais carga e mais descanso a mais repetições.';
function persist(){ D.rascunho={data:hoje(),plano,log,swaps,notas,ajustes,relogio,foco:S.foco?{i:S.foco.i,s:S.foco.s}:null,ts:Date.now()}; save(); }
/* treino que ficou aberto num dia anterior (acabou a bateria, esqueceu de encerrar): vira treino salvo daquele dia */
function salvarRascunhoAntigo(r){ try{

    return {nome:(r.swaps||{})[id]||e.nome, bw:!!e.bw, sets, nota:((r.notas||{})[id]||'').trim()}; }).filter(i=>i && (i.sets.length||i.nota));
  if (!itens.some(i=>i.sets.length)) return; const id = 'r'+r.data+(r.plano||''); if (D.sessions.some(x=>x.id===id)) return;

/* séries/reps/descanso valendo hoje (ajuste do dia por cima do plano) */
const ef = e => ajustes[e.id] ? Object.assign({}, e, ajustes[e.id]) : e;
function restaurarRascunho(){ const r=D.rascunho; if(r && r.data===hoje()){ log=r.log||{}; swaps=r.swaps||{}; notas=r.notas||{}; ajustes=r.ajustes||{}; relogio=r.relogio||null; if(r.plano) plano=r.plano; } else { if (r && r.data < hoje() && (r.ts||0) > (D.fechadoEm||0)) salvarRascunhoAntigo(r); D.rascunho=null; log={}; swaps={}; notas={}; ajustes={}; relogio=null; } }
/* grava no aparelho NA HORA (sem esperar), e manda para a nuvem logo em seguida */

/* junta o que veio da nuvem com o que está aqui: nada feito offline se perde */
function mesclar(rem, loc){ let mudou = false; const apag = new Set([...(rem.apagados||[]), ...(loc.apagados||[])]);
  for (const k of ['sessions','atividades']){ const r = rem[k]||[], ids = new Set(r.map(x=>x.id)); const extras = (loc[k]||[]).filter(x=>x && x.id && !ids.has(x.id) && !apag.has(x.id)); const fica = r.filter(x=>!apag.has(x.id)); if (extras.length || fica.length!==r.length) mudou = true; rem[k] = fica.concat(extras); }

  rem.fechadoEm = fech; if (apag.size){ rem.apagados = [...apag].slice(-300); }

async function load(){

}

function conectarNuvem(u){

  const outroDono = !!(D._dono && D._dono !== u.uid);

      else if ((D._u||0) > (c._u||0) && primeira) cloudPush();

/* ---------- treino do dia ---------- */
const getPlanBase = id => (D.hojeCustom && D.hojeCustom.data===hoje() && id===D.hojeCustom.plano.id) ? D.hojeCustom.plano : (D.plans.find(p=>p.id===id)||D.plans[0]);
/* treino de hoje sem os exercícios que você tirou só hoje */
const pulado = e => !!(ajustes[e.id] && ajustes[e.id].pular);
const getPlan = id => { const p = getPlanBase(id); if (!p || id!==plano || !p.ex.some(pulado)) return p; return Object.assign({}, p, {ex: p.ex.filter(e=>!pulado(e)), pulados: p.ex.filter(pulado)}); };
const planosVisiveis = () => (D.hojeCustom && D.hojeCustom.data===hoje()) ? [D.hojeCustom.plano, ...D.plans] : D.plans;
/* combinados com o coach: "essa semana sem perna", "pausa até domingo"… */
const combinadosAtivos = () => (D.combinados||[]).filter(c=>!c.ate || hoje() <= c.ate);
const planosFora = () => { const f = new Set(combinadosAtivos().flatMap(c=>c.semPlanos||[])); return D.plans.every(p=>f.has(p.id)) ? new Set() : f; };

function nSeries(e){ return Math.max(ef(e).series, (log[e.id]||[]).length); }
function sugSet(nome,s){ for(let i=D.sessions.length-1;i>=0;i--){ const it=D.sessions[i].itens.find(x=>x.nome===nome); if(it&&it.sets.length){ const v=it.sets[s]||it.sets[it.sets.length-1]; return {kg:v.kg,reps:v.reps}; } } return {}; }
function ultima(nome){ for(let i=D.sessions.length-1;i>=0;i--){ const it=D.sessions[i].itens.find(x=>x.nome===nome); if(it&&it.sets.length) return {txt: it.sets.map(s=>it.bw?`${s.reps??'–'}`:`${s.kg??'–'}×${s.reps??'–'}`).join('  ')+`  (${br(D.sessions[i].data)})`, it, data:D.sessions[i].data}; } return null; }
const topReps = r => { const m = String(r||'').match(/(\d+)\s*(?:–|-|a)\s*(\d+)/); if (m) return +m[2]; const n = parseInt(r); return isFinite(n) ? n : null; };

function sugestaoCarga(e, nome){ if (e.bw) return null; const u = ultima(nome); if(!u) return null; const top = topReps(e.reps); const sets = u.it.sets.filter(x=>x.kg);

/* ---------- semana ---------- */
const ehBola = a => /futebol|bola|pelada|futsal|society/i.test(a.esporte||'');
const ehCorre = a => /corr|camin|trot|run/i.test(a.esporte||'');
function semanaDados(w){ const fim = addDias(w,6), dentro = k => k>=w && k<=fim;
  const musc = D.sessions.filter(s=>dentro(s.data)).length;
  const at = D.atividades.filter(a=>dentro(a.data));

  const dias = []; for (let i=0;i<7;i++){ const k = addDias(w,i); if (k<=hoje()) dias.push(k); }
  const agua = dias.length ? sum(dias, k=>(D.dias[k]?.agua)||0)/dias.length : 0;

function metaSemana(){ const c = combinadosAtivos().find(x=>x.treinos!=null && (!x.ate || x.ate <= addDias(segunda(),6))); const m = metaSemanaBase(); return c ? Object.assign({}, m, {treinos: c.treinos}) : m; }

/* ---------- comida: proteína do dia ---------- */

function diaDe(k){ const d=D.dias[k]||(D.dias[k]={feito:[],agua:0,nota:''}); if(!d.comido)d.comido=[]; if(!d.mealEat)d.mealEat={}; if(d.kcalExtra===undefined)d.kcalExtra=0; return d; }

function refeicaoAgora(){ const h = new Date().getHours()*60+new Date().getMinutes(); const rs = D.refeicoes.map(r=>{ const [hh,mm] = String(r.hora||'12:00').split(':').map(Number); return {r, d: Math.abs((hh*60+(mm||0))-h)}; }).sort((a,b)=>a.d-b.d); return rs[0]?.r || D.refeicoes[0]; }

/* ---------- barra: entende o que você escreve ---------- */
const ESPORTES = [[/\bcorr(i|ida|er)|\btrot|\brun\b/,'Corrida'],[/\bcamin(hei|hada)/,'Caminhada'],[/\b(futebol|bola|pelada|futsal|society)\b/,'Futebol'],[/\b(pedal|bike|bicicleta|ciclismo)/,'Bike'],[/\bnad(ei|ar|o)\b|\bnatac/,'Natação'],[/\b(funcional|crossfit)/,'Funcional'],[/\b(alonga|yoga|mobilidade)/,'Alongamento']];
function acharExercicio(txt){ const n = norm(txt); const p = getPlan(plano); const todos = [...p.ex, ...D.plans.flatMap(x=>x.ex)];
  let best = null, bs = 0;
  for (const e of todos){ const nome = norm(swaps[e.id]||e.nome); const ws = nome.split(/[^a-z0-9]+/).filter(w=>w.length>2 && !['com','sem','para','livre','maquina','barra','halteres','halter','sentado','polia'].includes(w));
    let sc = 0; ws.forEach((w,i)=>{ if (new RegExp('\\b'+w.slice(0, Math.max(4, w.length-2))).test(n)) sc += i===0 ? 3 : 1; });
    if (p.ex.includes(e)) sc += 0.5; if (sc > bs){ bs = sc; best = e; } }
  return bs >= 3 ? best : null; }
function parseDur(t){ let m = t.match(/(\d+)\s*h\s*(\d+)?/i); if (m) return (+m[1])*60 + (+m[2]||0); m = t.match(/(\d+)\s*(min|minutos?|m\b)/i); if (m) return +m[1]; m = t.match(/(\d+):(\d{2})/); if (m) return +m[1] + (+m[2])/60; return null; }

  const t = raw.trim(); if (!t) return null; const n = norm(t);
  let m;
  if ((m = n.match(/\b(peso|pesei|balanca)\b[^\d]*(\d{2,3}(?:[.,]\d+)?)/)) || (m = n.match(/^(\d{2,3}[.,]\d)\s*kg$/))) return {tipo:'peso', kg: num(m[2]||m[1]), txt:t};

const CIENCIA = `BASE CIENTÍFICA (siga isto; quando ajudar, cite em 1 linha, ex.: "uma meta-análise de 2024 mostrou…"; nunca invente estudo, autor ou número):
- Volume: a hipertrofia cresce com as séries semanais por músculo, com retornos decrescentes (Pelland e cols., 2024, meta-regressão): mínimo eficaz ~4 séries/semana; a maior parte do ganho vem até ~10–20 séries; acima disso o custo de recuperação sobe mais que o ganho. A força estabiliza cedo no volume (poucas séries pesadas já bastam) e se beneficia mais de carga alta e de treinar o movimento ~2x/semana.
- Proximidade da falha: hipertrofia melhora chegando perto da falha (0–3 repetições na reserva); a força quase não depende disso (Robinson e cols., 2024). Na prática: séries pesadas a 1–3 reps da falha; falha real só na última série de isoladores.
- Carga e repetições: hipertrofia parecida de ~5 a 30 reps se perto da falha; força cresce mais com carga pesada (Schoenfeld e cols., 2017; Lopez e cols., 2021). Se a pessoa prefere mais carga e mais descanso: compostos em ~5–8 reps, isoladores ~8–12.
- Descanso: mais de 60–90 s dá pequena vantagem pra hipertrofia (Singer e cols., 2024, meta-análise bayesiana); nos compostos pesados, 2–3 min preservam carga e reps na série seguinte (Schoenfeld e cols., 2016). Descanso longo não é "perder tempo": é o que deixa a próxima série pesada de verdade.
- Progressão: dupla progressão (fechou o topo das reps em todas as séries → sobe a carga e volta pro início da faixa).
- Volta após pausa: força e massa voltam rápido (memória muscular); 1ª semana com ~80–85% da carga e 1 série a menos, subindo em 2–3 semanas.
- Amplitude: amplitude completa, enfatizando a posição alongada do músculo, tende a dar mais hipertrofia.
- Se a pessoa corre ou joga bola: o treino concorrente quase não atrapalha a hipertrofia, mas perna pesada perto do futebol derruba desempenho e aumenta risco; separe perna e futebol por pelo menos 48 h.
- Dor muscular tardia não é sinal de treino bom; dor leve permite treinar, dor forte pede descanso ou outro grupo muscular.
- Com 1 hora de treino, priorize menos exercícios com séries de qualidade a muitos exercícios corridos.`;

let tFim = 0;
function startTimer(s){ tL=s; tFim=Date.now()+s*1000; $('#timer').classList.add('on'); tick(); if (S.foco) renderFoco(); clearInterval(tI); tI=setInterval(()=>{ tL=Math.max(0,Math.ceil((tFim-Date.now())/1000)); tick(); if(tL<=0) stopTimer(true); },1000); }

function stopTimer(b){ clearInterval(tI); tL = 0; $('#timer').classList.remove('on'); if (S.foco) renderFoco(); if(b){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(), o=c.createOscillator(), g=c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value=880; g.gain.setValueAtTime(.25,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6); o.start(); o.stop(c.currentTime+.6); if(navigator.vibrate) navigator.vibrate([200,80,200]); }catch(e){} } }

function historicoEx(nome, bw){ const h = []; D.sessions.forEach(s=>s.itens.filter(i=>i.nome===nome).forEach(i=>{ const top = bw ? Math.max(0,...i.sets.map(x=>x.reps||0)) : Math.max(0,...i.sets.map(x=>x.kg||0)); const rm = Math.max(0,...i.sets.map(x=>e1rm(x.kg||0,x.reps||0))); if (top>0) h.push({data:s.data, top, rm, sets:i.sets}); })); return h; }
function vibeEx(e, nome){ const h = historicoEx(nome, e.bw), un = e.bw ? 'reps' : 'kg'; if (!h.length) return {txt:'Primeira vez aqui. Bora marcar território.', cls:'novo'};
  const u = h[h.length-1], dias = Math.round((Date.now()-new Date(u.data+'T12:00:00'))/864e5);

  if (ult.length===3 && ult[0]===ult[1] && ult[1]===ult[2]) return {txt:`Travado em ${f1(ult[2])} ${un} há 3 treinos. Hoje é dia de tentar +1 rep ou subir a carga.`, cls:'trava'};
  if (ult.length>=2 && ult[ult.length-1] < ult[ult.length-2]) return {txt:`Caiu um pouco no último. Sono e comida em dia? Hoje recupera.`, cls:'down'};
  return {txt:`Constante em ${f1(u.top)} ${un}. Consistência é o que constrói.`, cls:'ok'}; }

  const ch = D.cargasHoje && D.cargasHoje.data===hoje() ? (D.cargasHoje.por||{})[nome] : null;
  const kg = v.kg!=null && v.kg!=='' ? num(v.kg) : ant && ant.ok && ant.kg!=null ? num(ant.kg) : ch && ch.kg!=null ? ch.kg : e.kgSug!=null ? e.kgSug : sg ? sg.kg : u.kg!=null ? u.kg : null;
  const reps = v.reps!=null && v.reps!=='' ? num(v.reps) : ant && ant.ok && ant.reps!=null ? num(ant.reps) : ch && ch.reps ? ch.reps : u.reps!=null ? u.reps : (topReps(e.reps) || 10);

function fecharFoco(){ S.foco = null; S.excAberto = null; persist(); document.body.classList.remove('focando'); $('#foco').innerHTML=''; $('#foco').hidden = true; render(); }

  const ei = $('#excIn'); if (ei && guarda.exc) ei.value = guarda.exc; box.scrollTop = guarda.sc; if (guarda.id){ const el = document.getElementById(guarda.id); if (el){ el.focus({preventScroll:true}); } }

/* ---------- PROGRESSO ---------- */
function viewProg(){
  const L = D.pesos[D.pesos.length-1], d7 = D.sessions.filter(s=>s.data>=addDias(hoje(),-6)).length;
  const nomes = [...new Set(D.sessions.flatMap(s=>s.itens.filter(i=>!i.bw).map(i=>i.nome)))].sort();
  const sel = memo.get('exSel') && nomes.includes(memo.get('exSel')) ? memo.get('exSel') : nomes[0];
  const prs = nomes.map(n=>{ let b = {v:0}; D.sessions.forEach(s=>s.itens.filter(i=>i.nome===n).forEach(i=>i.sets.forEach(x=>{ const v = e1rm(x.kg||0,x.reps||0); if (v>b.v) b = {v, kg:x.kg, reps:x.reps, data:s.data}; }))); return {n, ...b}; }).filter(x=>x.v).sort((a,b)=>b.data<a.data?-1:1).slice(0,8);
  const hist = [...D.sessions.map(s=>({k:'s', data:s.data, ts:s.ts||0, s})), ...D.atividades.map(a=>({k:'a', data:a.data, ts:a.ts||0, a}))].sort((a,b)=>a.data===b.data?b.ts-a.ts:(a.data<b.data?1:-1)).slice(0,40);

    <section class="panel"><div class="ph"><h2 style="--hc:var(--sky)">Peso corporal</h2>${D.pesos.length>1?`<span class="num note" style="margin:0">${(L.kg-D.pesos[0].kg>0?'+':'')+f1(L.kg-D.pesos[0].kg)} kg</span>`:''}</div>
      <form class="row" id="pesoF"><input class="in" id="pesoIn" inputmode="decimal" placeholder="Peso de hoje, ex.: 78,4"><button class="btn p" style="flex:0 0 auto">Salvar</button></form><svg class="chart" id="chPeso"></svg></section>
    <section class="panel"><div class="ph"><h2 style="--hc:var(--tang)">Evolução de carga</h2></div>
      ${nomes.length?`<select class="in" id="exSel">${nomes.map(n=>`<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('')}</select><svg class="chart" id="chCarga"></svg><p class="note" id="cargaInfo"></p>`:`<p class="note">Encerre um treino e a evolução aparece aqui.</p>`}</section>

    ${prs.length?`<section class="panel"><div class="ph"><h2 style="--hc:var(--amber)">Recordes</h2></div>${prs.map(p=>`<div class="li"><span class="t">${esc(p.n)}<small>${br(p.data)} · 1RM estimado ${f1(p.v)} kg</small></span><span class="v">${f1(p.kg)}×${p.reps}</span><span></span></div>`).join('')}</section>`:''}
    <section class="panel">${calendario()}</section>
    <section class="panel"><div class="ph"><h2 style="--hc:var(--blue)">Histórico</h2></div>
      ${hist.length?hist.map(h=>h.k==='s'?`<div class="li"><button class="t" style="text-align:left" data-act="rel:${h.s.id}"><span class="badge">${esc(h.s.plano==='Hoje'?'★':h.s.plano)}</span>${h.s.itens.length} exercícios ›<small>${diaSem(h.data)} ${br(h.data)}${h.s.ia?' · comentário do coach':''}</small></button><span class="v">${Math.round(volume(h.s))} kg</span><button class="x" data-act="delSess:${h.s.id}" aria-label="Apagar treino">✕</button></div>`
        :`<div class="li"><span class="t"><span class="badge c">${ic(ehBola(h.a)?'bola':'corre',14)}</span>${esc(h.a.esporte)}<small>${diaSem(h.data)} ${br(h.data)}</small></span><span class="v">${h.a.km?f1(h.a.km)+' km ':''}${h.a.min?Math.round(h.a.min)+' min':''}</span><button class="x" data-act="delAtiv:${h.a.id}" aria-label="Apagar">✕</button></div>`).join(''):`<p class="note">Nada ainda.</p>`}</section>
  </div></div>`;

const volume = s => s.itens.reduce((a,i)=>a+i.sets.reduce((b,x)=>b+((x.kg||0)*(x.reps||0)),0),0);
function calendario(){ const cm = memo.get('calMes') || hoje().slice(0,7); const [y,m] = cm.split('-').map(Number); const prim = new Date(y,m-1,1).getDay(), n = new Date(y,m,0).getDate();
  let h = `<div class="ph"><button class="ib" data-act="cal:-1" aria-label="Mês anterior">‹</button><b style="text-transform:capitalize">${new Date(y,m-1,15).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button class="ib" data-act="cal:1" aria-label="Próximo mês">›</button></div><div class="cal">${['D','S','T','Q','Q','S','S'].map(d=>`<span>${d}</span>`).join('')}`;
  for (let i=0;i<prim;i++) h += `<button class="vz" tabindex="-1"></button>`;
  for (let d=1; d<=n; d++){ const k = `${cm}-${pad(d)}`, ss = D.sessions.filter(s=>s.data===k), aa = D.atividades.filter(a=>a.data===k);
    h += `<button class="${ss.length?'has':''} ${aa.length?'cardio':''} ${k===hoje()?'hoje':''}" ${ss.length?`data-act="rel:${ss[0].id}"`:''} title="${ss.map(s=>'Treino '+s.plano).concat(aa.map(a=>a.esporte)).join(', ')}">${d}</button>`; }
  return h + `</div><p class="note">Azul: musculação · laranja: corrida/futebol.</p>`; }
function cor(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#2D5BFF'; }
function linha(id, pts, un, corV){ const svg = document.getElementById(id); if (!svg) return; const W=620,H=170,P=30; svg.setAttribute('viewBox',`0 0 ${W} ${H}`); const c = cor(corV), mut = cor('--muted'), ln = cor('--line');
  if (pts.length<2){ svg.innerHTML = `<text x="10" y="90" fill="${mut}" font-family="JetBrains Mono" font-size="12">precisa de 2 registros ou mais</text>`; return; }

  [/tilapia|peixe|merluza|pescada/,26],[/salmao/,25],[/atum/,26],[/sardinha/,24],[/camarao/,24],
  [/peito de peru/,20],[/presunto/,18],[/queijo/,25],[/requeijao/,10],[/iogurte/,5],[/leite/,3.3],
  [/feijao/,5],[/lentilha|grao de bico/,9],[/arroz/,2.5],[/macarrao|massa/,5],[/pao/,9],[/tofu/,8],[/pasta de amendoim|amendoim/,25],[/castanha/,15]

function chaveAlimento(t){ return norm(t).replace(/~?\s*\d+[.,]?\d*\s*(g|kg|gramas|ml|prot\w*)?/g,' ').replace(/\b(comi|almocei|jantei|lanchei|tomei|de|do|da|com|e|um|uma|dois|duas|tres|meio|meia|scoops?|doses?|medidas?|latas?|fatias?|potes?|copos?|unid\w*|proteina|prot|g|gramas)\b/g,' ').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,2).join(' '); }
function calcProt(texto){
  const n = norm(texto); let m;
  // proteína informada direto
  if ((m = n.match(/(\d+[.,]?\d*)\s*g?\s*(de\s*)?(prot|proteina)/)) || (m = n.match(/~\s*(\d+[.,]?\d*)\s*g/)) || (m = n.match(/prot\w*\s*(\d+[.,]?\d*)/))) return {p: Math.round(num(m[1])), como:'você informou', fonte:'direto'};

  const peso = (m = n.match(/(\d+[.,]?\d*)\s*(kg|g|gramas)\b/)) ? num(m[1]) * (m[2]==='kg' ? 1000 : 1) : null;
  let qtd = (m = n.match(/(^|\s)(\d+[.,]?\d*)\s*(?!g\b|kg\b|gramas)([a-z]+)/)) ? num(m[2]) : null; if (qtd==null){ const w = n.split(/\s+/).find(w=>NUM_PALAVRA[w]); if (w) qtd = NUM_PALAVRA[w]; }

/* ================= RELÓGIO DO TREINO: meta de tempo (60 min por padrão) ================= */
const metaMin = () => (relogio && relogio.meta) || D.metaMin || 60;
function iniciarRelogio(){ if (relogio) return; relogio = {inicio: Date.now(), meta: D.metaMin || 60, mov: Date.now(), avisos: []}; persist(); desenharRelogio(); }
const mmss = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s/60)}:${pad(s%60)}`; };
/* quanto falta de trabalho: séries que faltam × (≈45 s de execução + descanso) */
function trabalhoRestante(){ const p = getPlan(plano); let s = 0; for (const e of p.ex){ const pr = progressoEx(e), r = Math.max(0, pr.ns - pr.n); if (r) s += r*45 + (r-1)*ef(e).rest + (pr.n ? ef(e).rest : 0) + (pr.n ? 0 : 30); } return s + (tL > 0 ? tL : 0); }
function estadoRelogio(){ const agora = Date.now(), dec = (agora - relogio.inicio)/1000, meta = metaMin()*60, falta = meta - dec, resto = trabalhoRestante(), folga = falta - resto;
  const parado = tL > 0 ? 0 : (agora - (relogio.mov||relogio.inicio))/1000; const p = getPlan(plano), ultimoRest = Math.max(60, ...p.ex.map(e=>ef(e).rest));
  return {dec, meta, falta, resto, folga, parado: resto > 0 && parado > ultimoRest + 120 ? parado : 0, fim: new Date(agora + resto*1000)}; }
function desenharRelogio(){ const el = $('#relogio'); const on = !!relogio; document.body.classList.toggle('cronando', on); if (!on){ el.hidden = true; return; } el.hidden = false; tickRelogio(); }
function tickRelogio(){ if (!relogio) return; const el = $('#relogio'); if (!el || el.hidden) return; const st = estadoRelogio();
  const cls = st.falta < 0 ? 'over' : st.parado ? 'parado' : st.folga < -60 ? 'atras' : 'ok';
  const hh = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const sub = st.falta < 0 ? `passou da meta de ${metaMin()} min` : st.resto <= 0 ? 'tudo feito · encerre' : st.parado ? `parado há ${Math.floor(st.parado/60)} min · bora pra próxima` : st.folga < -60 ? `atrasado ${Math.ceil(-st.folga/60)} min · toque para enxugar` : `no ritmo · acaba ${hh(st.fim)}`;
  el.className = 'rel ' + cls; el.style.setProperty('--rp', Math.min(100, st.dec/st.meta*100).toFixed(1));
  el.querySelector('b').textContent = st.falta < 0 ? '+' + mmss(-st.falta) : mmss(st.falta); el.querySelector('small').textContent = sub;
  /* avisos que vibram: 15 min, 5 min, fim, e celular parado demais */
  const av = relogio.avisos ||= []; const avisa = (k, msg) => { if (av.includes(k)) return; av.push(k); persist(); try{ navigator.vibrate && navigator.vibrate([150,80,150]); }catch(e){} toast(msg, null, 6000); };
  if (st.falta < 0) avisa('fim', `Deu ${metaMin()} min. Fecha o que falta ou encerra.`);
  else if (st.falta < 300) avisa('5', 'Faltam 5 minutos para a meta.');
  else if (st.falta < 900) avisa('15', st.folga < 0 ? 'Faltam 15 min e não cabe tudo. Toque no relógio para enxugar.' : 'Faltam 15 minutos. Tá no ritmo.');
  if (st.parado && !av.includes('p'+Math.floor((relogio.mov||0)/1000))) avisa('p'+Math.floor((relogio.mov||0)/1000), 'Celular de lado: bora pra próxima série.');
}

/* enxugar: tira séries dos últimos exercícios até caber na meta (nunca abaixo de 2 séries) */
function planoEnxugar(){ const st = estadoRelogio(); let falta = -st.folga; const p = getPlan(plano), cortes = {};
  if (falta <= 0) return {cortes, ganho:0};
  for (let volta = 0; volta < 3 && falta > 0; volta++){
    for (let i = p.ex.length-1; i >= 0 && falta > 0; i--){ const e = p.ex[i], pr = progressoEx(e), ns = (cortes[e.id] ?? pr.ns); const rest = ns - pr.n;
      if (rest >= 1 && ns > 2 && ns - 1 >= pr.n){ cortes[e.id] = ns - 1; falta -= 45 + ef(e).rest; } } }
  return {cortes, ganho: Math.max(0, -st.folga - Math.max(0, falta)), sobra: falta}; }
function folhaRelogio(){ const ativo = !!relogio, st = ativo ? estadoRelogio() : null, m = metaMin(), en = ativo ? planoEnxugar() : null, p = getPlan(plano);
  abrirFolha(`<h3>Meta de tempo</h3><p class="note">${ativo ? `Começou às ${new Date(relogio.inicio).toTimeString().slice(0,5)} · ${Math.round(st.dec/60)} min até agora · falta trabalho para ~${Math.ceil(st.resto/60)} min.` : 'O relógio começa quando você toca em “Começar treino” ou marca a primeira série.'}</p>
    <div class="rel-meta"><button class="fo-ib" data-act="relMeta:${m-5}" aria-label="Menos 5 minutos">${ic('menos',18)}</button><b class="num">${m} min</b><button class="fo-ib" data-act="relMeta:${m+5}" aria-label="Mais 5 minutos">${ic('mais',18)}</button></div>
    <div class="chips" style="justify-content:center;margin-top:8px">${[40,45,50,60,75,90].map(x=>`<button class="chip ${x===m?'on':''}" data-act="relMeta:${x}">${x} min</button>`).join('')}</div>
    ${ativo && st.resto > 0 && st.folga < -60 ? `<div class="box-i" style="border-color:var(--amber)"><span class="il">Não cabe tudo em ${m} min</span>${Object.keys(en.cortes).length ? `Tirando estas séries, você ganha ~${Math.round(en.ganho/60)} min:<ul style="margin:6px 0 0;padding-left:18px">${p.ex.filter(e=>en.cortes[e.id]!=null).map(e=>`<li>${esc(swaps[e.id]||e.nome)}: ${progressoEx(e).ns} → ${en.cortes[e.id]} séries</li>`).join('')}</ul>${en.sobra > 60 ? `<div class="note">Ainda passa ~${Math.ceil(en.sobra/60)} min. Descanse menos ou encerre antes.</div>` : ''}<div class="btns"><button class="btn o" data-act="enxugar">Enxugar e caber</button></div>` : 'Já está no mínimo de séries. Descanse menos ou encerre antes.'}</div>` : ativo && st.resto > 0 ? `<div class="box-i" style="border-color:var(--mint)"><span class="il">Tá no ritmo</span>Termina por volta de ${st.fim.toTimeString().slice(0,5)}, com ${Math.max(0, Math.round(st.folga/60))} min de folga.</div>` : ''}
    <div class="btns">${ativo ? `<button class="btn" data-act="relZera">Zerar relógio</button><button class="btn" data-act="relPara">Parar relógio</button>` : `<button class="btn o" data-act="relInicia">Começar relógio agora</button>`}<button class="btn" data-act="fechar">Fechar</button></div>`); }

/* ---------- ler treino colado ou de arquivo ---------- */
function lerTreinoLocal(t){ const planos = []; let atual = null;
  for (let l of String(t||'').split(/\n/)){ l = l.replace(/^[\s\-•*·\d.)]+(?=[A-Za-zÀ-ú])/,'').trim(); if (!l) continue;
    const cab = l.match(/^(?:treino|dia|ficha)\s*([A-Za-z0-9]+)\s*[-–:)]?\s*(.*)$/i) || l.match(/^([A-F])\s*[-–:)]\s*(.+)$/);
    const ex = l.match(/^(.+?)[\s:–-]+(\d{1,2})\s*[x×]\s*([\d–\-a\/ ]+?(?:\s*(?:reps?|repetições|s|seg|segundos))?)\s*$/i);
    if (cab && !ex){ atual = {id: /^\d+$/.test(cab[1]) ? String.fromCharCode(64 + +cab[1]) : cab[1].toUpperCase().slice(0,2), nome: cab[2] || `Treino ${cab[1]}`, exercicios:[]}; planos.push(atual); continue; }
    if (ex){ if (!atual){ atual = {id:'A', nome:'Treino A', exercicios:[]}; planos.push(atual); } atual.exercicios.push({nome: ex[1].trim(), series: +ex[2], reps: ex[3].replace(/\s*(reps?|repetições)$/i,'').trim().replace('-', '–'), descanso: 90}); } }
  return planos.filter(p=>p.exercicios.length); }
const lerArquivo = f => new Promise((ok, erro) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = erro; if (/^text\/|\.csv$|\.txt$/i.test(f.type+f.name)) r.readAsText(f); else r.readAsDataURL(f); });
async function mtLer(){ const texto = ($('#mtTexto')?.value||'').trim(), arq = MT.arquivo;
  if (!texto && !arq){ toast('Cole o treino ou escolha um arquivo.'); return; }
  if (!S.ia || (!arq && !texto)){ const planos = lerTreinoLocal(texto); if (!planos.length){ toast('Não consegui ler. Coloque um exercício por linha, ex.: “Supino 4x10”.'); return; } MT.previa = {planos, explicacao:'', dias: planos.length>=4 ? 4 : planos.length+1}; abrirMontar(); return; }
  MT.busy = true; abrirMontar();
  const pedido = `Transcreva o treino de musculação abaixo (pode ser texto, foto ou PDF de uma ficha). NÃO invente exercícios: mantenha os que estão lá, com séries, repetições e descanso como escritos. Se faltar descanso, use 90 s (120–180 s em exercícios pesados multiarticulares). Se não houver divisão por dias, agrupe em um treino A. Corrija nomes óbvios e padronize em português do Brasil. Sugira 1–2 alternativas por exercício.
Responda só JSON: {"explicacao":"1 a 3 linhas: o que você entendeu e qualquer dúvida (ex.: descanso não informado)","dias":número sugerido de treinos por semana,"planos":[{"id":"A","nome":"curto","exercicios":[{"nome":"","series":3,"reps":"10–12","descanso":90,"bw":false,"nota":"","alts":[""]}]}]}
${texto ? `TEXTO:\n${texto.slice(0,6000)}` : ''}`;
  try{ let conteudo = pedido;
    if (arq){ if (arq.texto) conteudo = pedido + `\nARQUIVO:\n${arq.texto.slice(0,8000)}`; else conteudo = [pedido, {inlineData:{mimeType: arq.mime, data: arq.b64}}]; }
    const r = await S.ia.json(conteudo); const planos = (r.planos||[]).filter(p=>(p.exercicios||[]).length);
    if (!planos.length) throw Object.assign(new Error('json'), {code:'invalid_json'});
    MT.previa = {planos, dias: r.dias, explicacao: r.explicacao||''}; }
  catch(e){ const loc = lerTreinoLocal(texto); if (loc.length){ MT.previa = {planos: loc, explicacao:'Li direto do texto, sem a IA.', dias: loc.length+1}; } else toast(S.ia.erro(e)); }

const b64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const deB64url = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c=>c.charCodeAt(0));
async function comprimir(txt){ const bytes = new TextEncoder().encode(txt); if (!window.CompressionStream) return 'j' + b64url(bytes);
  const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw')); return 'z' + b64url(new Uint8Array(await new Response(cs).arrayBuffer())); }
async function descomprimir(s){ const tipo = s[0], bytes = deB64url(s.slice(1)); if (tipo==='j') return new TextDecoder().decode(bytes);

async function acao(a, el){

    case 'relInicia': iniciarRelogio(); fecharFolha(); render(); toast(`Relógio começou: ${metaMin()} min.`); return;
    case 'relZera': if (relogio){ relogio.inicio = Date.now(); relogio.mov = Date.now(); relogio.avisos = []; persist(); } fecharFolha(); desenharRelogio(); toast('Relógio zerado.'); return;
    case 'relPara': { const r0 = relogio; relogio = null; persist(); fecharFolha(); render(); toast('Relógio parado.', ()=>{ relogio = r0; persist(); render(); }); return; }
    case 'enxugar': { const en = planoEnxugar(); fecharFolha(); if (!Object.keys(en.cortes).length) return; persist();

    case 'comidaEd': memo.set('edComida', arg); render(); setTimeout(()=>{ const i=$('#comidaVal'); i?.focus(); i?.select(); },0); return;
    case 'comidaOk': { const k = memo.get('dia')||hoje(); const x = comidasDia(k).find(y=>y.id===arg); const v = parseInt($('#comidaVal')?.value); memo.delete('edComida'); if (!x || isNaN(v)){ render(); return; }

    case 'esquecer': { const nome = decodeURIComponent(arg); comDesfazer(`Esqueci “${nome}”`, ()=>{ delete D.alimentos[nome]; }); return; }
    case 'planoOk': D.planNovo.visto = true; save(); render(); toast('Treino novo valendo. Primeiro: '+getPlan(proximo()).nome); return;
    case 'planoVolta': comDesfazer('Voltou para o treino de antes', ()=>{ if (D.plansAnteriores) D.plans = D.plansAnteriores; D.planNovo.visto = true; plano = proximo(); }); return;
    case 'exVibe': exVibe(arg); return;

let atualP = null;
function atualizarPreview(){ const q = $('#q'), v = q.value; q.style.height='48px'; if (v.includes('\n') || q.scrollHeight>52) q.style.height = Math.min(140, q.scrollHeight)+'px';
  const pv = $('#pv'); if (!v.trim()){ atualP = null; $('#goBtn').disabled = true; pv.innerHTML = `<span class="hint">Escreva do jeito que falaria: séries, corrida, futebol, peso. Várias coisas de uma vez também.</span>`; return; }
  const P = parseTexto(v); atualP = P; $('#goBtn').disabled = false;
  const cor = {peso:'b', agua:'b', sono:'v', atividade:'o', comida:'y', series:'g'};
  pv.innerHTML = P.itens.map(it=>`<span class="pill ${cor[it.tipo]||''}">${esc(descItem(it))}${it.incompleto?' · faltou tempo/km':''}</span>`).join('') + (P.falhas.length ? `<span class="pill r">${P.falhas.length} trecho${P.falhas.length>1?'s':''} sem entender</span><button class="chip" data-act="iaBarra">Ler com IA</button>` : '') + (!P.itens.length ? `<span class="hint">Toque em Lançar e a IA lê.</span>` : '');
}
async function lancarBarra(){ const v = $('#q').value.trim(); if (!v) return; const P = atualP || parseTexto(v);
  if (!P.itens.length || P.falhas.length && !P.itens.length) return iaBarra();
  const itens = P.itens; $('#q').value=''; atualizarPreview();
  comDesfazer(res => res.join(' · ') + (P.falhas.length ? ` · não entendi: “${P.falhas.join('”, “')}”` : ''), ()=>aplicarItens(itens));
}
async function iaBarra(){ const v = $('#q').value.trim(); if (!v) return; const pv = $('#pv'); pv.innerHTML = `<span class="load">A IA está lendo…</span>`;
  const exs = getPlan(plano).ex.map(e=>`${e.id}=${swaps[e.id]||e.nome}`).join('; ');
  try{ const r = await S.ia.json(`Converta o que a pessoa escreveu sobre treino/saúde em itens. Hoje é ${hoje()}. Exercícios do treino de hoje (id=nome): ${exs}.
Texto: "${v}"
Responda só JSON: [{"tipo":"series","exId":"id do exercício","sets":[{"kg":40,"reps":10}]} | {"tipo":"atividade","esporte":"Corrida|Futebol|Caminhada|Bike|Natação|outro","km":null,"min":null,"kcal":null} | {"tipo":"peso","kg":78.4} | {"tipo":"agua","copos":2} | {"tipo":"sono","h":7} | {"tipo":"comida","t":"descrição curta","p":gramas de proteína estimadas}]`);
    const arr = (Array.isArray(r) ? r : (r.itens||[])).map(x=>{ if (x.tipo==='series'){ const e = getPlan(plano).ex.find(e=>e.id===x.exId) || acharExercicio(String(x.exId||'')); return e ? {tipo:'series', ex:e, sets:(x.sets||[]).map(s=>({kg:num(s.kg), reps:parseInt(s.reps)||null}))} : null; } return x; }).filter(x=>x && x.tipo);
    if (!arr.length){ pv.innerHTML = `<span class="pill r">A IA também não entendeu. Tente “supino 40kg 10 10 8”.</span>`; return; }
    $('#q').value=''; atualizarPreview(); comDesfazer(res => res.join(' · '), ()=>aplicarItens(arr));
  }catch(e){ pv.innerHTML = `<span class="pill r">${esc(S.ia.erro(e))}</span>`; } }
