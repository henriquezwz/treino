  if (t.dataset.pn){ const p = D.plans.find(x=>x.id===t.dataset.pn); if (p && t.value.trim()){ p.nome = t.value.trim(); save(); render(); } return; }
  if (t.dataset.e){ const [id, k] = t.dataset.e.split(':'); const p = D.plans.find(x=>x.id===editP), ex = p?.ex.find(x=>x.id===id); if (!ex) return;
    if (k==='alts') ex.alts = t.value.split(',').map(s=>s.trim()).filter(Boolean); else if (k==='bw') ex.bw = t.checked; else if (k==='series'||k==='rest') ex[k] = Math.max(1, parseInt(t.value)||1); else ex[k] = t.value;
    save(); if (k==='bw') render(); return; }
});
document.addEventListener('submit', async e=>{ const f = e.target; e.preventDefault();
  if (f.id==='excF'){ const i = $('#excIn'), q = i.value; i.value=''; perguntarExercicio(f.dataset.ex, q); return; }
  if (f.id==='ajF'){ const fd = new FormData(f), id = f.dataset.ex, esc0 = e.submitter?.value==='plano' ? 'plano' : 'hoje'; const ex = getPlan(plano).ex.find(x=>x.id===id); const a0 = ef(ex);
    const a = {}; const se = parseInt(fd.get('series')), re = String(fd.get('reps')||'').trim(), de = parseInt(fd.get('descanso'));
    if (se>0 && (se!==a0.series || esc0==='plano')) a.series = se; if (re && (re!==String(a0.reps) || esc0==='plano')) a.reps = re; if (de>0 && (de!==a0.rest || esc0==='plano')) a.descanso = de;
    fecharFolha(); if (!Object.keys(a).length){ toast('Nada mudou.'); return; } persist(); comDesfazer(x => x || 'Nada mudou', ()=>aplicarAjuste(id, a, esc0)); return; }
  if (f.id==='askF'){ const q = $('#askIn').value; $('#askIn').value=''; perguntarCoach(q); return; }
  if (f.id==='pesoF'){ const v = num($('#pesoIn').value); if (!v){ toast('Digite o peso, ex.: 78,4'); return; } comDesfazer(`Peso ${f1(v)} kg salvo`, ()=>aplicarItens([{tipo:'peso', kg:v}])); return; }
  if (f.id==='swapF'){ const v = $('#swapIn').value.trim(); if (!v) return; const id = f.dataset.ex; const e2 = getPlan(plano).ex.find(x=>x.id===id); swaps[id] = v; if (!(e2.alts||[]).includes(v)){ (e2.alts ||= []).push(v); } persist(); fecharFolha(); render(); return; }
  if (f.id==='metaF'){ const v = $('#metaNova').value.trim(); if (!v) return; D.metas.push({id:uid(), t:v, s:''}); save(); render(); return; }
  if (f.id==='refF'){ const r = D.refeicoes.find(x=>x.id===f.dataset.id); const fd = new FormData(f); r.hora = String(fd.get('h')).trim(); r.nome = String(fd.get('n')).trim()||'Refeição'; r.itens = String(fd.get('i')).split('\n').map(s=>s.trim()).filter(Boolean); D.refeicoes.sort((a,b)=>(a.hora||'').localeCompare(b.hora||'')); save(); fecharFolha(); render(); return; }
  if (f.id==='comidaF'){ const v = $('#comidaIn').value; $('#comidaIn').value=''; memo.delete('prevComida'); adicionarComida(v, memo.get('dia')||hoje()); return; }
  if (f.id==='loginF' && e.submitter && e.submitter.value==='criar'){ const fd = new FormData(f); const em = String(fd.get('email')).trim(), se = String(fd.get('senha')); if (se.length<6){ toast('A senha precisa de pelo menos 6 caracteres.'); return; }
    try{ await carregarFirebase(); await comPrazo(FB.authM.createUserWithEmailAndPassword(FB.auth, em, se), 15000); fecharFolha(); toast('Conta criada. Seus treinos agora ficam salvos na nuvem.'); }
    catch(err){ toast(/email-already/i.test(err.code||'') ? 'Esse e-mail já tem conta. Toque em “Entrar”.' : /invalid-email/i.test(err.code||'') ? 'Esse e-mail não parece certo.' : /weak/i.test(err.code||'') ? 'Senha fraca. Use pelo menos 6 caracteres.' : 'Não consegui criar a conta agora.', null, 6000); } return; }
  if (f.id==='loginF' && e.submitter && e.submitter.value==='senha'){ const em = String(new FormData(f).get('email')).trim(); if (!em){ toast('Escreva seu e-mail primeiro.'); return; }
    try{ await carregarFirebase(); await FB.authM.sendPasswordResetEmail(FB.auth, em); toast('Te mandei um e-mail para criar uma senha nova.', null, 6000); }catch(err){ toast('Não consegui mandar o e-mail agora.'); } return; }
  if (f.id==='loginF'){ const fd = new FormData(f); const b = f.querySelector('button.p'); b.disabled = true; b.textContent = 'Entrando…'; await entrarEmail(String(fd.get('email')).trim(), String(fd.get('senha'))); b.disabled = false; b.textContent = 'Entrar'; return; }
  if (f.dataset.eatf){ const rid = f.dataset.eatf, t = f.querySelector('[data-et]').value.trim(); let p = parseInt(f.querySelector('[data-ep]').value)||0; if (!t){ toast('Escreva o que comeu.'); return; }
    const k = memo.get('dia')||hoje(); const id = uid(); comDesfazer(`Registrado: ${t}`, ()=>{ (diaDe(k).mealEat[rid] ||= []).push({id, t, p}); });
    if (!p){ try{ const r = await S.ia.json(`Estime os gramas de PROTEÍNA desta refeição brasileira: "${t}". Responda só JSON {"p":número inteiro,"obs":"curta"}`); const g = parseInt(r.p)||0; const x = (diaDe(k).mealEat[rid]||[]).find(y=>y.id===id); if (x && g){ x.p = g; save(); render(); toast(`A IA estimou ${g} g de proteína${r.obs?` (${r.obs})`:''}`); } }catch(err){} }
    return; }
});
document.addEventListener('keydown', e=>{ const tt = e.target; if (e.key==='Enter' && (tt.id==='comidaVal' || tt.id==='alvoIn')){ e.preventDefault(); tt.closest('.inl')?.querySelector('button')?.click(); return; } if (e.key==='Escape'){ if ($('#layer').classList.contains('on')) fecharFolha(); else if (S.foco) fecharFoco(); } const t = e.target; if (e.key==='Enter' && t.id==='metaIn'){ e.preventDefault(); t.closest('.inl')?.querySelector('button')?.click(); } });
$('#q').addEventListener('input', atualizarPreview);
$('#q').addEventListener('keydown', e=>{ if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); lancarBarra(); } });
$('#goBtn').onclick = lancarBarra;
$('#temaBtn').onclick = ()=>{ const t = document.documentElement.dataset.tema; aplicarTema(t==='escuro' ? 'claro' : 'escuro'); render(); };
function aplicarTema(t){ document.documentElement.dataset.tema = t; lsSet('caderno:tema', t); $('#temaBtn').textContent = t==='escuro' ? '☾' : '☀'; }

/* ================= APP NO CELULAR E ATUALIZAÇÃO ================= */
let pedidoInstalar = null;
if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); pedidoInstalar = e;
  if (!lsGet('caderno:instalar') && !matchMedia('(display-mode: standalone)').matches) setTimeout(()=>{ if (!pedidoInstalar || $('#convApp')) return; const d = document.createElement('div'); d.id='convApp'; d.className='conv'; d.innerHTML = `<span><b>Quer o Treino como app?</b> Abre direto da tela inicial.</span><button data-act="instalarApp">Instalar</button><button class="x" data-act="naoInstalar">Agora não</button>`; document.body.appendChild(d); }, 4000); });
addEventListener('appinstalled', ()=>{ lsSet('caderno:instalar','feito'); $('#convApp')?.remove(); toast('Pronto: o Treino está na sua tela inicial.'); });
async function instalarApp(){ $('#convApp')?.remove(); if (pedidoInstalar){ pedidoInstalar.prompt(); const r = await pedidoInstalar.userChoice.catch(()=>({})); lsSet('caderno:instalar', r.outcome==='accepted'?'feito':'nao'); pedidoInstalar = null; render(); }
  else abrirFolha(/iphone|ipad/i.test(navigator.userAgent) ? `<h3>Pôr na tela inicial</h3><ol class="passos"><li>No Safari, toque em <b>Compartilhar</b> (quadrado com seta).</li><li>Toque em <b>Adicionar à Tela de Início</b>.</li><li>Confirme em <b>Adicionar</b>.</li></ol><div class="btns"><button class="btn p w" data-act="fechar">Entendi</button></div>`
    : `<h3>Pôr na tela inicial</h3><ol class="passos"><li>Abra este endereço no <b>Chrome</b> (não dentro do WhatsApp ou do Instagram).</li><li>Toque nos <b>3 pontinhos ⋮</b> no canto de cima.</li><li>Toque em <b>Instalar app</b>. Se não aparecer, toque em <b>Adicionar à tela inicial</b> e depois em <b>Instalar</b>.</li><li>O ícone laranja e azul aparece na tela inicial e na lista de apps, com o nome <b>Treino</b>.</li></ol><p class="note">Se já tinha um atalho antigo do Treino, apague-o antes e instale de novo.</p><div class="btns"><button class="btn p w" data-act="fechar">Entendi</button></div>`); }
const abertoEm = Date.now(); let avisouVersao = false;
async function procurarVersao(manual){ if (!/github\.io$/.test(location.hostname)){ if (manual) toast('A atualização automática funciona no site.'); return; }
  try{ const r = await fetch('version.json?t='+Date.now(), {cache:'no-store'}); const j = await r.json();
    if (!j.v || j.v===VERSAO){ if (manual) toast(`Você já está na versão mais nova (${VERSAO}).`); return; }
    let tentou = null; try{ tentou = sessionStorage.getItem('caderno:tentou'); }catch(e){}
    const mexendo = $('#layer.on') || (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.value);
    if (manual || (Date.now()-abertoEm < 8000 && !mexendo && tentou!==j.v)){ try{ sessionStorage.setItem('caderno:tentou', j.v); }catch(e){} return atualizarAgora(); }
    if (avisouVersao) return; avisouVersao = true; const d = document.createElement('div'); d.className='conv'; d.id='novaVersao'; d.innerHTML = `<span><b>Versão nova do Treino.</b></span><button data-act="atualizarApp">Atualizar agora</button>`; document.body.appendChild(d);
  }catch(e){ if (manual) toast('Sem conexão para procurar atualização.'); } }
async function atualizarAgora(){ try{ const regs = await navigator.serviceWorker?.getRegistrations?.() || []; for (const r of regs) await r.update().catch(()=>{}); const ks = await caches?.keys?.() || []; for (const k of ks) await caches.delete(k); }catch(e){} location.replace(location.pathname + '?v=' + Date.now()); }
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') procurarVersao(false); });

/* ================= INÍCIO ================= */
(async()=>{
  aplicarTema(lsGet('caderno:tema') || 'claro');
  $('#view').innerHTML = `<div class="panel"><div class="load">Abrindo seu caderno…</div></div>`;
  await load(); plano = (D.rascunho && D.rascunho.data===hoje() && D.rascunho.plano) || (D.hojeCustom && D.hojeCustom.data===hoje() ? 'Hoje' : proximo());
  render(); setTimeout(()=>procurarVersao(false), 1500); treinoDoLink(); addEventListener('hashchange', treinoDoLink);
  if (S.autoSalvo){ const m = S.autoSalvo; setTimeout(()=>toast(m, null, 8000), 600); S.autoSalvo = null; save(); }
  /* voltou para o app no meio do treino (fechou, descarregou): reabre no mesmo exercício e série */
  const rf = D.rascunho && D.rascunho.data===hoje() && D.rascunho.foco; if (rf && Date.now() - (D.rascunho.ts||0) < 3*3600e3 && getPlan(plano).ex[rf.i]){ S.foco = {i: rf.i, s: rf.s||0}; document.body.classList.add('focando'); renderFoco(); }
  setTimeout(()=>gerarInsights(false), 2500);
})();
